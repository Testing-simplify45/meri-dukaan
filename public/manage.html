<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Manage store</title>
<style>
:root{color-scheme:light dark;--bg:#f8f9fb;--card:#fff;--ink:#1a2236;--mute:#667085;--line:#e8ebf2;--ac:#4f46e5;--ac2:#6d4be8;--on:#fff;--soft:#eef0ff;--ok:#0f8a5f;--okb:#e5f7ef;--wn:#a15c00;--wnb:#fff4dc;--er:#d12b3f;--erb:#fdebee;--in:#1d6fd1;--inb:#e8f2ff;--pk:#d6336c;--pkb:#ffeaf3;--dk:#11162b}

*{box-sizing:border-box;touch-action:manipulation}[hidden]{display:none!important}html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent}
svg.i{width:22px;height:22px;flex:none;display:block}
button{font:inherit}
#app{display:flex;min-height:100vh}

.brand{font-weight:800;font-size:1.1rem;margin:0 10px 16px;overflow-wrap:anywhere}

.seg button{border:0;background:none;color:var(--mute);font-weight:600;padding:8px 14px;border-radius:10px;cursor:pointer}.seg button.on{background:var(--soft);color:var(--ac)}
.hero{position:relative;overflow:hidden;color:#fff;background:linear-gradient(125deg,#4d38df 0%,#6241e5 62%,#7548e9 100%);border-radius:24px;padding:20px 18px;margin:0 0 22px;box-shadow:0 10px 24px rgba(83,57,220,.22)}
.hero:before{content:"";position:absolute;width:210px;height:210px;border-radius:50%;right:-70px;top:-90px;background:rgba(255,255,255,.08)}.hero:after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;right:-60px;bottom:-120px;background:rgba(255,255,255,.07)}
.hero>*{position:relative}.hero small{display:block;opacity:.85}.hero .big{font-size:2.3rem;font-weight:800;margin:4px 0 14px;letter-spacing:-.5px}.hero b{font-size:1.3rem}
.hero .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hero .two div{background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:11px 13px}

.sh{display:flex;justify-content:space-between;align-items:center;margin:24px 0 10px}.sh h2{margin:0;font-size:1.15rem}.sh a,.lnk{color:var(--ac);font-weight:600;text-decoration:none;background:none;border:0;cursor:pointer;padding:0}

.pg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pc{display:flex;align-items:center;gap:12px;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;cursor:pointer;color:var(--ink)}
.pc b{display:block;font-size:1.6rem;line-height:1.1}.pc em{font-style:normal;color:var(--mute);font-size:.88rem;display:block}.sm3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.sm3 b{display:block;font-size:1.05rem}
.at{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:10px;cursor:pointer;width:100%;text-align:left;color:var(--ink)}
.at.crit{border-color:var(--er)}.at b{display:block}.at .lnk{padding:6px 4px}
.grp{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}.oi{padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}.oi:last-child{border-bottom:0}
.chip{display:inline-block;background:var(--bg);border-radius:999px;padding:3px 11px;font-size:.78rem;margin:0 6px 6px 0;color:var(--mute)}
.store{background:var(--dk);color:#fff;border-radius:22px;padding:18px;margin:24px 0 14px}.store a{color:#b9b6ff;font-weight:600;text-decoration:none;display:inline-flex;gap:5px;align-items:center}.store a svg.i{width:16px;height:16px}
.store .st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.store .st div{background:rgba(255,255,255,.08);border-radius:15px;padding:12px 6px;text-align:center;font-size:.82rem;color:#c7ccdc}.store .st b{display:block;font-size:1.5rem;color:#fff}
.store .lbl{color:#aab2c7;font-size:.82rem;margin:4px 0 6px}.linkbar{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border-radius:14px;padding:6px 6px 6px 12px}.linkbar .url{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#f3f4fa}.linkbar svg.i{color:#b9b6ff}
.store .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.store .btns button{border:0;border-radius:14px;padding:13px;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;background:rgba(255,255,255,.1)}.store .btns .wa{background:#10b981}.store .btns svg.i{width:19px;height:19px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-weight:650;border:0;border-radius:14px;padding:12px 18px;background:var(--ac);color:var(--on);cursor:pointer;text-align:center}.btn svg.i{width:18px;height:18px}
.btn.g{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn.sm{padding:8px 13px;font-size:.88rem;border-radius:12px}.btn.red{color:var(--er)}.btn.wide{width:100%}.btn.cp{background:#fff;color:#1b2032;padding:8px 13px;border-radius:11px;font-size:.85rem}
input,select,textarea{font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);width:100%;margin:5px 0 12px}
select{width:auto;margin:0}label{display:block;font-size:.84rem;color:var(--mute)}.ck{display:flex;gap:8px;align-items:center;color:var(--ink)}.ck input{width:auto;margin:0}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.cap{font-size:.78rem;font-weight:800;letter-spacing:.8px;color:var(--mute);margin:0 0 10px;text-transform:uppercase}
.srch{position:relative;margin-bottom:14px}.srch svg.i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mute);width:20px;height:20px}.srch input{margin:0;padding:14px 14px 14px 46px;border-radius:16px;background:var(--card)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 14px;padding:0 18px;scrollbar-width:none}.chips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 18px;font-weight:600;cursor:pointer}.chips button.on{background:var(--ac);border-color:var(--ac);color:var(--on)}
.pr{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:10px;cursor:pointer;width:100%;text-align:left;color:var(--ink)}.pr.crit{border-color:var(--er)}
.pr .pic{width:56px;height:56px;border-radius:14px;overflow:hidden;background:#fff;flex:none;display:grid;place-items:center;border:1px solid var(--line)}.pr .pic img{width:100%;height:100%;object-fit:contain}.pr .pic.tile{border:0}
.pr .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pr .rt{text-align:right;flex:none}.pr .rt b{display:block;font-size:1.05rem;margin-bottom:4px}
.ord-tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:5px;margin-bottom:12px}.ord-tabs button{border:0;border-radius:13px;background:transparent;color:var(--mute);font-weight:650;padding:12px 6px;cursor:pointer}.ord-tabs button.on{background:var(--ac);color:var(--on)}
.cnt{display:inline-block;min-width:22px;padding:1px 7px;border-radius:999px;background:rgba(255,255,255,.25);font-size:.78rem;margin-left:4px}
.intro{display:flex;gap:8px;align-items:center;color:var(--mute);margin:4px 0 14px}.intro svg.i{width:18px;height:18px}
.oe{padding:18px;position:relative}.oe-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}.oe-h b{font-size:1.15rem}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.li:last-of-type{border-bottom:0}
.qty{display:flex;align-items:center;gap:10px}.qty button{width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:1.1rem;cursor:pointer;display:grid;place-items:center;padding:0}.qty b{min-width:20px;text-align:center;font-size:1.05rem}
.tot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:14px;margin-top:6px}.tot b{font-size:1.4rem}
.two2{display:grid;grid-template-columns:1fr 2fr;gap:12px;margin-top:14px}
.pic3{border-radius:10px;object-fit:contain;background:#fff;flex:none;border:1px solid var(--line)}
.mode{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:16px;padding:5px;gap:4px}.mode button{border:0;background:transparent;border-radius:12px;padding:11px;font-weight:650;color:var(--mute);display:flex;gap:8px;align-items:center;justify-content:center;cursor:pointer}.mode button.on{background:var(--card);color:var(--ac);box-shadow:0 2px 6px rgba(20,30,60,.1)}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tri button,.pm button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 6px;font-weight:650;color:var(--mute);cursor:pointer}.tri button.on{background:var(--okb);border-color:var(--ok);color:var(--ok)}.tri button.on.p{background:var(--wnb);border-color:var(--wn);color:var(--wn)}.tri button.on.u{background:var(--erb);border-color:var(--er);color:var(--er)}
.pm{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 4px}.pm button.on{background:var(--soft);border-color:var(--ac);color:var(--ac)}
.dash{width:100%;border:2px dashed var(--line);background:transparent;color:var(--ac);border-radius:16px;padding:14px;font-weight:650;display:flex;gap:8px;align-items:center;justify-content:center;cursor:pointer;margin-top:12px}
.ph-row{display:flex;gap:10px;align-items:center}.pre{display:grid;place-items:center;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:0 14px;margin:5px 0 12px;color:var(--mute)}
.tl{display:flex;justify-content:space-between;padding:5px 0;color:var(--mute)}.tl.big{border-top:1px solid var(--line);margin-top:8px;padding-top:12px;color:var(--ink);font-weight:800;font-size:1.2rem}
.fix{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;justify-content:center}.fix>*{max-width:520px}.fix .btn{flex:1}.fix .btn.g{flex:0 0 36%}
.back{display:flex;align-items:center;gap:14px;margin-bottom:18px}.back h1{font-size:1.5rem}
.bigav{position:relative;width:136px;height:136px;margin:6px auto 12px}.bigav img,.bigav .av{width:136px;height:136px;border-radius:50%;border:5px solid var(--card);box-shadow:0 4px 14px rgba(20,30,60,.15);font-size:2.6rem}.bigav .cam{position:absolute;right:2px;bottom:6px;width:42px;height:42px;border-radius:50%;background:var(--ac);color:var(--on);display:grid;place-items:center;border:3px solid var(--bg);cursor:pointer}
.rows{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:12px}.rows button{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:16px;text-align:left;color:var(--ink);cursor:pointer;font-weight:600}.rows button:last-child{border-bottom:0}.rows .grow{flex:1}.rows svg.i{color:var(--mute)}.rows .red{color:var(--er)}.rows .red svg.i{color:var(--er)}
.field{position:relative}.field svg.i{position:absolute;left:14px;top:21px;color:var(--mute);width:20px;height:20px}.field input{padding-left:46px}
.sw{position:relative;display:inline-block;width:44px;height:26px;flex:none;margin:0}.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.15s}.sw i:before{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}.sw input:checked+i{background:var(--ok)}.sw input:checked+i:before{left:21px}.sw input:disabled+i{opacity:.45}
.th{width:78px;height:52px;border-radius:12px;object-fit:contain;background:#fff;flex:none;display:grid;place-items:center;border:1px solid var(--line)}
.ph2{position:relative;display:inline-block}.ph2 button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--er);color:#fff;cursor:pointer;line-height:1;padding:0}
.tg{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:7px 13px;margin:0 6px 6px 0;color:var(--ink);font-size:.9rem}.tg input{width:auto;margin:0}
.dot{position:absolute;top:8px;right:9px;width:11px;height:11px;border-radius:50%;background:#ef3b2d;border:2px solid var(--card)}.dot.big{top:16px;right:16px;border:0;box-shadow:0 0 0 3px rgba(239,59,45,.22)}
.ic2{position:relative;display:inline-block}.ic2 .dot{top:-3px;right:-5px}
dialog{border:1px solid var(--line);border-radius:22px;background:var(--card);color:var(--ink);width:min(520px,94vw);padding:20px;max-height:92vh}dialog::backdrop{background:rgba(10,14,30,.5)}
.handle{width:44px;height:5px;border-radius:9px;background:var(--line);margin:-8px auto 14px;display:none}
.cr{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;text-align:left;color:var(--ink);cursor:pointer}.cr b{display:block}.cr .tile{width:50px;height:50px}
.bn{display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);justify-content:space-around;align-items:flex-end;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.bn button{flex:1;background:none;border:0;color:var(--mute);font-size:.76rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;cursor:pointer}.bn button.on{color:var(--ac)}
.bn .fab{flex:none;width:58px;height:58px;border-radius:50%;background:var(--ac);color:var(--on);margin:-30px 8px 0;box-shadow:0 0 0 7px var(--card),0 8px 18px rgba(79,70,229,.4);justify-content:center;padding:0}.bn .fab svg.i{width:26px;height:26px}
.login{max-width:380px;margin:60px auto}.err{color:var(--er);min-height:1.2em}.pad{height:0}
:focus-visible{outline:3px solid #f5b700;outline-offset:2px}
@media(min-width:801px){.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.fix{left:220px}}
@media(max-width:800px){
 #app{flex-direction:column}aside{display:none}.bn{display:flex}.dsk{display:none}
 main{padding:16px 18px calc(110px + env(safe-area-inset-bottom,0px))}
 input,select,textarea{font-size:16px}.fg{grid-template-columns:1fr}.fg.keep{grid-template-columns:1fr 1fr}
 dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:24px 24px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}.handle{display:block}
 .fix{bottom:0}
}

</head>
<body>
<div id="login" class="card login"><h1 style="font-size:1.5rem">Manage your store</h1><label style="margin-top:10px">Username<input id="user" autocomplete="username" autocapitalize="none"></label><label>Password or store key<input id="key" type="password" autocomplete="current-password"></label><button class="btn wide" onclick="login()">Open</button><p class="err" id="err"></p></div>
<div id="app" hidden>
  <aside><div class="brand" id="brand">Store</div><nav id="nav"></nav></aside>
  <main><div class="top" id="topbar"></div><div id="view"></div></main>
</div>
<nav class="bn" id="bn"></nav>
<div id="fixbar"></div>
<dialog id="dlg"></dialog>

// ----- stock and expiry facts shared by Home and Products -----
const daysTo = p => p.expiry ? Math.ceil((new Date(p.expiry) - Date.now()) / 864e5) : null;
function stockInfo(p) {
  const low = p.lowAt ?? 5, d = daysTo(p);
  if (p.qty != null && p.qty <= 0) return { cls: "er", txt: "Out of stock", crit: true };
  if (d != null && d < 0) return { cls: "er", txt: "Expired", crit: true };
  if (p.qty != null && p.qty <= low) return { cls: "er", txt: "Only " + p.qty + " left", crit: true };
  if (d != null && d <= 30) return { cls: "wn", txt: "Expiring soon" };
  if (p.qty != null && p.qty <= low * 3) return { cls: "wn", txt: "Low · " + p.qty };
  return p.qty == null ? { cls: "nt", txt: "Not tracked" } : { cls: "ok", txt: p.qty + " in stock" };
}
function alerts() {
  const A = [];
  P.forEach(p => {
    const low = p.lowAt ?? 5, d = daysTo(p), q = p.qty;
    if (q != null && q <= 0) A.push({ crit: 1, ico: "alert", c: "er", name: p.name, txt: "Out of stock", id: p.id, re: 1 });
    else if (q != null && q <= low) A.push({ crit: 1, ico: "alert", c: "er", name: p.name, txt: "Only " + q + " left", id: p.id, re: 1 });

  return `<div class="card oe" onclick="seen('${n}')">${o.seen === false ? `<i class="dot big" id="d-${n}"></i>` : ""}
    <div class="oe-h"><div><b>${esc(o.name)}</b><div class="mute">#${n} · ${ago(o.createdAt)}${!own && o.phone ? " · " + esc(o.phone) : ""}</div></div>${chan(o)}</div>

    ${own ? `<div class="tot" style="border-top:0;padding-top:0"><div><span class="mute">Total</span><br><b>${inr(o.total)}</b></div><div class="row" style="justify-content:flex-end"><span class="bd ${DB[o.status]}">${DL[o.status]}</span><span class="bd ${PB[ps]}">${ps}</span></div></div>` : `<div class="row" style="margin:6px 0"><span class="bd ${DB[o.status]}">${DL[o.status]}</span></div>`}
    <div class="row nw" style="margin-top:10px;align-items:flex-end;gap:10px"><label class="grow">Delivery<select style="width:100%" ${cancelled ? "disabled" : ""} onclick="event.stopPropagation()" onchange="setStatus('${n}',this.value)">${stOpts.map(k => `<option value="${k}" ${o.status == k ? "selected" : ""}>${DL[k]}</option>`).join("")}</select></label>
      ${own ? `<label class="grow">Payment<select style="width:100%" ${cancelled ? "disabled" : ""} onclick="event.stopPropagation()" onchange="setPay('${n}',this.value)">${PO.map(([v, l]) => `<option value="${v}" ${payNow(o) == v ? "selected" : ""}>${l}</option>`).join("")}</select></label>` : ""}</div>
    <div class="acts">${own ? `${!cancelled && due(o) > 0 ? `<button class="btn sm" onclick="event.stopPropagation();openPay('${n}')">Record payment</button>` : ""}<a class="btn g sm" target="_blank" rel="noopener" href="${esc(invLink(o))}" onclick="event.stopPropagation()">View invoice</a>${o.phone ? `<a class="btn g sm" target="_blank" rel="noopener" href="${esc(waInvoice(o))}" onclick="event.stopPropagation()">Share invoice</a>` : ""}${!cancelled && due(o) > 0 && o.phone ? `<a class="btn g sm" target="_blank" rel="noopener" href="${esc(wa(o))}" onclick="event.stopPropagation()">Send reminder</a>` : ""}<button class="btn g sm red" onclick="event.stopPropagation();openDelete('${n}')" aria-label="Delete order ${n}">${ic("trash")} Delete</button>` : `<button class="btn g sm" onclick="event.stopPropagation();viewOrder('${n}')">View order</button>`}</div></div>`;
}
function editOrderCard(o) {
  const n = esc(o.number), qs = orderDrafts[o.number] || Object.fromEntries(o.lines.map((l, i) => [i, l.qty])); orderDrafts[o.number] = qs;
  const total = o.lines.reduce((s, l, i) => s + l.price * Math.max(0, Number(qs[i] ?? l.qty)), 0);
  return `<article class="card oe" onclick="seen('${n}')">${o.seen === false ? `<i class="dot big" id="d-${n}"></i>` : ""}
    <div class="oe-h"><div><b>${esc(o.name)}</b><div class="mute">#${n} · ${ago(o.createdAt)}${o.phone ? " · " + esc(o.phone) : ""}</div></div>${chan(o)}</div>
    ${o.lines.map((l, i) => `<div class="li"><div style="min-width:0"><div>${esc(l.name)}</div><div class="mute">${inr(l.price)} each</div></div><div class="qty"><button onclick="event.stopPropagation();changeOrderQty('${n}',${i},-1)" aria-label="Decrease quantity">${ic("minus")}</button><b>${Number(qs[i] ?? l.qty)}</b><button onclick="event.stopPropagation();changeOrderQty('${n}',${i},1)" aria-label="Increase quantity">${ic("plus")}</button></div>${thumb(l, 40)}</div>`).join("")}
    <div class="tot"><span class="mute" style="font-size:1rem">Total</span><b>${inr(total)}</b></div>
    <div class="acts"><button class="btn g sm" onclick="event.stopPropagation();viewOrder('${n}')">View order</button><button class="btn g sm red" onclick="event.stopPropagation();openDelete('${n}')" aria-label="Delete order ${n}">${ic("trash")} Delete</button></div>
    <div class="two2"><button class="btn g red" onclick="event.stopPropagation();rejectOrder('${n}')">Reject</button><button class="btn" onclick="event.stopPropagation();confirmOrder('${n}')">${ic("check")} Confirm order</button></div></article>`;
}
function changeOrderQty(n, i, delta) { const o = O.find(x => x.number === n); if (!orderDrafts[n]) orderDrafts[n] = Object.fromEntries(o.lines.map((l, j) => [j, l.qty])); orderDrafts[n][i] = Math.max(0, Number(orderDrafts[n][i] ?? o.lines[i].qty) + delta); draw(); }
async function confirmOrder(n) {
  const o = O.find(x => x.number === n), qs = orderDrafts[n] || Object.fromEntries(o.lines.map((l, i) => [i, l.qty]));
  const lines = o.lines.map((l, i) => ({ id: l.id, qty: Number(qs[i] ?? l.qty) })).filter(l => l.qty > 0);
  if (!lines.length) return alert("Set at least one item quantity before confirming.");
  try { await api(base + "/orders/" + n + "/items", "PUT", { lines }); await api(base + "/orders/" + n, "PATCH", { status: "Packed" }); delete orderDrafts[n]; await load(); orderTab = "confirmed"; draw(); }
  catch (e) { alert(e.message); }
}
function rejectOrder(n) { if (confirm("Reject this order? Items will be returned to stock.")) act(() => api(base + "/orders/" + n, "PATCH", { status: "Cancelled" })); }

function setStatus(n, v) {
  if (v == "Cancelled" && !confirm("Cancel this order? The items go back into stock.")) return draw();
  act(() => api(base + "/orders/" + n, "PATCH", { status: v }));
}
function setPay(n, v) {
  if (v == "part") return openPay(n);
  act(() => api(base + "/orders/" + n + "/payment", "PUT", v == "unpaid" ? { mode: "unpaid" } : { mode: "paid", method: v }));
}
function openPay(n) {
  const o = O.find(x => x.number == n);

function savePay(e, n) { e.preventDefault(); const b = Object.fromEntries(new FormData(e.target)); act(async () => { await api(base + "/orders/" + n + "/payments", "POST", b); closeM(); }); }

const blankInv = () => ({ id: "", name: "", phone: "", mode: "store", address: "", lines: [], discount: 0, gst: (ME.business && ME.business.gstDefault) || 0, notes: "", pay: { status: "paid", method: "UPI", amount: 0 } });
function newInvoice() { INV = blankInv(); go("inv"); }
function openDraft(id) { const d = DR.find(x => x.id == id); if (!d) return; INV = { ...blankInv(), ...d, lines: (d.lines || []).map(l => ({ ...l })), pay: { ...blankInv().pay, ...(d.pay || {}) } }; INV.id = id; go("inv"); }
function delDraft(id) { if (confirm("Delete this draft?")) act(() => api(base + "/drafts/" + id, "DELETE")); }
function invCalc() {
  const sub = sum(INV.lines, l => { const p = P.find(x => x.id == l.id); return p ? p.price * l.qty : 0; });
  const disc = Math.min(Math.max(0, +INV.discount || 0), sub), tax = sub - disc, gst = Math.round(tax * INV.gst / 100);
  return { sub, disc, gst, total: tax + gst };
}
function totalsHtml() { const c = invCalc(); return `<div class="tl"><span>Subtotal</span><span>${inr(c.sub)}</span></div><div class="tl"><span>Discount</span><span>−${inr(c.disc)}</span></div><div class="tl"><span>GST ${INV.gst}%</span><span>${inr(c.gst)}</span></div><div class="tl big"><span>Total</span><span>${inr(c.total)}</span></div>`; }
const invRecalc = () => { const t = $("itot"); if (t) t.innerHTML = totalsHtml(); };
function invQty(i, d) { const l = INV.lines[i], p = P.find(x => x.id == l.id), max = p && p.qty != null ? p.qty : 999; l.qty = Math.min(max, Math.max(1, l.qty + d)); draw(); }
const invDel = i => { INV.lines.splice(i, 1); draw(); };

    ${st == "partial" ? `<label style="margin-top:12px">Amount received now (₹)<input type="number" min="1" value="${INV.pay.amount || ""}" oninput="INV.pay.amount=+this.value"></label>` : ""}

    modal(`<div style="text-align:center"><div class="tile" style="margin:0 auto 12px;background:var(--okb);color:var(--ok);width:64px;height:64px;border-radius:50%">${ic("check", 30)}</div><h2 style="font-size:1.3rem;margin:0">Invoice created</h2><p class="mute">#${esc(r.number)} · ${inr(r.total)}</p></div>

  } catch (e) { alert(e.message); }

function shrinkAvatar(file) {
  return new Promise((ok, no) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const S = 480, c = document.createElement("canvas"); c.width = S; c.height = S;
      const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height, k = Math.max(S / iw, S / ih), w = iw * k, h = ih * k, x = c.getContext("2d");
      x.fillStyle = "#fff"; x.fillRect(0, 0, S, S); x.drawImage(img, (S - w) / 2, (S - h) / 2, w, h); URL.revokeObjectURL(u); ok(c.toDataURL("image/jpeg", .82));
    };
    img.onerror = () => no(new Error("Could not read that photo.")); img.src = u;
  });
}
async function uploadAvatar(el) {
  const f = el.files[0]; if (!f) return;
  try { const r = await api(base + "/account/photo", "POST", { data: await shrinkAvatar(f) }); ME.profile = { ...ME.profile, photo: r.photo }; draw(); } catch (e) { alert(e.message); }
}
function vAcct() {
  const pf = ME.profile || {}, nm = pf.name || ME.name || "", av = pf.photo ? `<img class="av" src="${esc(pf.photo)}" alt="">` : `<div class="av">${esc(String(nm || "?").charAt(0).toUpperCase())}</div>`;
  return `<div style="text-align:center"><div class="bigav">${av}<label class="cam" for="avf" aria-label="Change photo">${ic("camera")}</label></div><input id="avf" type="file" accept="image/*" hidden onchange="uploadAvatar(this)">
    <h2 style="margin:0;font-size:1.3rem">${esc(nm)}</h2><div class="mute">${owner() ? "Owner" : "Staff"} · ${esc(SN)}</div><label for="avf" class="lnk" style="display:inline-flex;gap:6px;align-items:center;margin:10px 0 18px;cursor:pointer;font-size:1rem;color:var(--ac)">${ic("upload")} Upload new photo</label></div>
  <div class="card"><div class="cap">Personal details</div>
    <label>Full name<div class="field">${ic("user")}<input id="acn" value="${esc(nm)}" autocomplete="name"></div></label>
    <label>Email ID<div class="field">${ic("mail")}<input id="ace" type="email" value="${esc(pf.email)}" autocomplete="email"></div></label>${owner() ? '<div class="mute" style="margin:-6px 0 12px">New-order alerts are sent to this email.</div>' : ""}
    <label>Phone number<div class="ph-row"><div class="pre">+91</div><input id="acp" style="margin:5px 0 12px" inputmode="tel" value="${esc(pf.phone)}" autocomplete="tel"></div></label></div>
  <div class="rows">${owner() ? `<button onclick="newKey()">${ic("key")}<span class="grow">Make a new store key</span>${ic("chev")}</button><button onclick="openBusiness()">${ic("building")}<span class="grow">Business details</span>${ic("chev")}</button>` : `<button onclick="openPassword()">${ic("lock")}<span class="grow">Change password</span>${ic("chev")}</button>`}<button class="red" onclick="logout()">${ic("out")}<span class="grow">Log out</span></button></div>`;
}
async function saveAccount() {
  try { await api(base + "/account", "PUT", { name: $("acn").value, email: $("ace").value, phone: $("acp").value }); ME = await api(base + "/me"); if (owner() && ME.business) SN = ME.business.name || SN; draw(); alert("Saved."); }
  catch (e) { alert(e.message); }
}
function openBusiness() {
  const b = ME.business || {};
  modal(`<form onsubmit="saveBusiness(event)"><h2 style="font-size:1.2rem">Business details</h2>
  <label>Business name<input name="name" required value="${esc(b.name || SN)}"></label><label>Address<input name="address" value="${esc(b.address)}"></label>
  <div class="fg keep"><label>GSTIN<input name="gstin" maxlength="15" value="${esc(b.gstin)}" style="text-transform:uppercase"></label><label>Phone<input name="phone" value="${esc(b.phone)}"></label></div>
  <label>Usual GST rate on invoices<select name="gstDefault" style="width:100%;margin:5px 0 12px">${[0, 5, 12, 18, 28].map(r => `<option value="${r}" ${(b.gstDefault || 0) == r ? "selected" : ""}>${r}%</option>`).join("")}</select></label>
  <p class="mute">Your address, phone and GSTIN print on invoices. The app only does the sums you ask for, so please check the GST rules with your accountant.</p>
  <div class="acts"><button type="button" class="btn g grow" onclick="closeM()">Cancel</button><button class="btn grow">Save</button></div></form>`);
}
async function saveBusiness(e) {
  e.preventDefault(); const b = Object.fromEntries(new FormData(e.target));
  try { await api(base + "/business", "PUT", b); ME = await api(base + "/me"); SN = ME.business.name; closeM(); draw(); } catch (er) { alert(er.message); }
}
function openPassword() {
  modal(`<form onsubmit="savePassword(event)"><h2 style="font-size:1.2rem">Change password</h2><label>Current password<input name="cur" type="password" required autocomplete="current-password"></label>
  <label>New password (6+ characters)<input name="nw" type="password" minlength="6" required autocomplete="new-password"></label><label>Type the new password again<input name="nw2" type="password" required autocomplete="new-password"></label>
  <div class="acts"><button type="button" class="btn g grow" onclick="closeM()">Cancel</button><button class="btn grow">Change password</button></div></form>`);
}
async function savePassword(e) {
  e.preventDefault(); const f = e.target.elements;
  if (f.nw.value !== f.nw2.value) return alert("The two new passwords don’t match.");
  try { await api(base + "/account/password", "POST", { current: f.cur.value, next: f.nw.value }); closeM(); alert("Password changed. Use it next time you log in."); } catch (er) { alert(er.message); }
}
async function newKey() {
  if (!confirm("Make a new store key? The old key stops working straight away, so tell anyone who uses it.")) return;
  try {
    const r = await api(base + "/account/new-key", "POST");
    if (r.viaStoreKey) { key = r.key; try { localStorage.setItem(SK, JSON.stringify({ key, tok })); } catch (e) {} }
    modal(`<h2 style="font-size:1.2rem">Your new store key</h2><p class="mute">Save it somewhere safe. It is shown only now.</p><div class="card" style="font-family:monospace;font-size:1.05rem;overflow-wrap:anywhere">${esc(r.key)}</div>
    <div class="acts"><button class="btn g grow" onclick="closeM()">Close</button><button class="btn grow" onclick="navigator.clipboard.writeText('${esc(r.key)}');this.textContent='Copied'">Copy key</button></div>`);
  } catch (e) { alert(e.message); }
}

// ----- Invoices: every invoice in one place (owner) -----
const dateOf = o => o.createdAt ? new Date(o.createdAt).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }) : "";
function invRows() {
  const q = invq.trim().toLowerCase();
  return O.filter(o => (invf == "cancelled" ? o.status == "Cancelled" : o.status != "Cancelled" && (invf == "all" || (invf == "unpaid" ? due(o) > 0 : due(o) <= 0))) && (!q || [o.number, o.name, o.phone].join(" ").toLowerCase().includes(q)));
}
function invListHtml() {
  const L = invRows(), live = L.filter(o => o.status != "Cancelled"), billed = sum(live, o => o.total), coll = sum(live, o => o.paid || 0);
  return `<div class="card" style="padding:14px"><div class="sm3"><div><span class="mute">Billed</span><b>${inr(billed)}</b></div><div><span class="mute">Collected</span><b style="color:var(--ok)">${inr(coll)}</b></div><div><span class="mute">Outstanding</span><b style="color:var(--er)">${inr(billed - coll)}</b></div></div></div>` +
  (L.map(o => { const ps = pst(o), n = esc(o.number), cancelled = o.status == "Cancelled";
    return `<div class="card oe" style="padding:14px"><div class="oe-h" style="margin-bottom:8px"><div><b>#${n}</b><div class="mute">${esc(o.name)}${o.phone ? " · " + esc(o.phone) : ""}</div></div><div style="text-align:right"><b>${inr(o.total)}</b><div class="mute">${dateOf(o)}</div></div></div>
      <div class="row"><span class="bd ${PB[ps]}">${ps}</span>${chan(o)}${o.gst > 0 ? `<span class="bd nt">GST ${o.gstRate}%</span>` : ""}${o.discount > 0 ? `<span class="bd nt">Discount ${inr(o.discount)}</span>` : ""}</div>
      <div class="acts"><a class="btn g sm" target="_blank" rel="noopener" href="${esc(invLink(o))}">${ic("file")} View</a>${o.phone ? `<a class="btn g sm" target="_blank" rel="noopener" href="${esc(waInvoice(o))}">${ic("wa")} Share</a>` : ""}${!cancelled && due(o) > 0 && o.phone ? `<a class="btn g sm" target="_blank" rel="noopener" href="${esc(wa(o))}">Remind</a>` : ""}<button class="btn g sm red" onclick="openDelete('${n}')" aria-label="Delete invoice ${n}">${ic("trash")} Delete</button></div></div>`; }).join("") || '<p class="mute" style="padding:12px 4px">No invoices here.</p>');
}
function vInvs() {
  if (!owner()) return '<p class="mute">Only the owner can see invoices.</p>';
  return `<div class="srch">${ic("search")}<input placeholder="Search by number, name or phone" value="${esc(invq)}" oninput="invq=this.value;$('ivl2').innerHTML=invListHtml()" autocomplete="off"></div>
  <div class="chips">${[["all", "All"], ["unpaid", "Unpaid"], ["paid", "Paid"], ["cancelled", "Cancelled"]].map(([v, l]) => `<button class="${invf == v ? "on" : ""}" onclick="invf='${v}';draw()">${l}</button>`).join("")}</div><div id="ivl2">${invListHtml()}</div>`;
}

// ----- Inventory: stock levels, quick adjust, history -----
const fmtDate = s => new Date(s).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
function ivRow(p) {
  const st = stockInfo(p), d = daysTo(p);
  return `<button class="pr ${st.crit ? "crit" : ""}" ${can("stock") ? `onclick="openAdjust('${p.id}')"` : ""}>${picOf(p)}<div class="grow"><div class="nm">${esc(p.name)}</div><div class="mute">${esc(p.sku || "No code")}${p.expiry ? " · " + (d < 0 ? "expired" : "expires " + fmtDate(p.expiry)) : ""}</div>${can("cost") && p.qty != null ? `<div class="mute">${inr((p.cost || 0) * p.qty)} at cost</div>` : ""}</div><div class="rt"><b style="font-size:1.3rem">${p.qty == null ? "—" : p.qty}</b><span class="bd ${st.cls}">${st.txt}</span></div></button>`;
}
function ivFilter(p) {
  const low = p.lowAt ?? 5, d = daysTo(p);
  return { all: 1, low: p.qty != null && p.qty > 0 && p.qty <= low * 3, oos: p.qty != null && p.qty <= 0, exp: d != null && d <= 30 }[ivf];
}
function histHtml() {
  if (SL === null) { loadLog(); return '<p class="mute">Loading history…</p>'; }
  const q = ivq.trim().toLowerCase(), L = SL.filter(r => !q || [r.name, r.sku, r.reason, r.by].join(" ").toLowerCase().includes(q));
  return L.map(r => `<div class="card" style="padding:12px 14px"><div class="row nw" style="justify-content:space-between;align-items:flex-start"><div style="min-width:0"><b>${esc(r.name)}</b><div class="mute">${esc(r.reason)}${r.note ? " · " + esc(r.note) : ""}</div></div><span class="bd ${r.delta > 0 ? "ok" : "er"}">${r.delta > 0 ? "+" : ""}${r.delta}</span></div><div class="mute" style="margin-top:4px">Now ${r.after} · ${esc(r.by)} · ${ago(r.at)}</div></div>`).join("") || '<p class="mute" style="padding:12px 4px">No stock changes yet.</p>';
}
async function loadLog() { try { SL = await api(base + "/stock-log"); } catch (e) { SL = []; } if (tab == "inven" && ivTab == "hist") { const b = $("ivb"); if (b) b.innerHTML = histHtml(); } }
const ivBody = () => ivTab == "hist" ? histHtml() : (P.filter(p => ivFilter(p) && (!ivq.trim() || [p.name, p.sku, p.supplier].join(" ").toLowerCase().includes(ivq.trim().toLowerCase()))).map(ivRow).join("") || '<p class="mute" style="padding:12px 4px">No products here.</p>');
function vInven() {
  if (!can("stock")) return '<p class="mute">You don’t have access to inventory.</p>';
  const low = P.filter(p => p.qty != null && p.qty > 0 && p.qty <= (p.lowAt ?? 5) * 3).length, out = P.filter(p => p.qty != null && p.qty <= 0).length, units = sum(P, p => p.qty || 0), value = sum(P, p => (p.cost || 0) * (p.qty || 0));
  const card = (i, b, c, l, v, fn) => `<button class="pc" onclick="${fn}">${tileIc(i, b, c)}<div><b>${v}</b><em>${l}</em></div></button>`;
  return `<div class="pg" style="margin-bottom:14px">${card("box", "#eef0ff", "#4f46e5", "Units in stock", units, "ivTab='stock';ivf='all';draw()")}${can("cost") ? card("trend", "#e5f7ef", "#0f9d6b", "Stock value", inr(value), "ivTab='stock';ivf='all';draw()") : card("layers", "#e5f7ef", "#0f9d6b", "Products", P.length, "ivTab='stock';ivf='all';draw()")}${card("batt", "#fff4dc", "#d98200", "Low on stock", low, "ivTab='stock';ivf='low';draw()")}${card("alert", "#fdebee", "#e0364d", "Out of stock", out, "ivTab='stock';ivf='oos';draw()")}</div>
  <div class="ord-tabs" style="grid-template-columns:1fr 1fr">${[["stock", "Stock"], ["hist", "History"]].map(([k, l]) => `<button class="${ivTab == k ? "on" : ""}" onclick="ivTab='${k}';ivq='';draw()">${l}</button>`).join("")}</div>
  <div class="srch">${ic("search")}<input placeholder="${ivTab == "hist" ? "Search the history" : "Search by name or code"}" value="${esc(ivq)}" oninput="ivq=this.value;$('ivb').innerHTML=ivBody()" autocomplete="off"></div>
  ${ivTab == "stock" ? `<div class="chips">${[["all", "All"], ["low", "Low on stock"], ["oos", "Out of stock"], ["exp", "Expiring"]].map(([v, l]) => `<button class="${ivf == v ? "on" : ""}" onclick="ivf='${v}';draw()">${l}</button>`).join("")}</div>` : ""}<div id="ivb">${ivBody()}</div>`;
}

// ----- suppliers -----
function vSup() {
  return (owner() ? `<form class="card" onsubmit="addSup(event)"><b>Add a supplier</b><div class="fg" style="margin-top:8px"><label>Name<input name="name" required></label><label>Phone<input name="phone"></label></div>
  <label>Note (optional)<input name="note"></label><button class="btn">Add supplier</button></form>` : "") +
  (S.map(s => `<div class="card row" style="justify-content:space-between"><div><b>${esc(s.name)}</b> <span class="mute">${esc(s.phone)} ${esc(s.note)}</span><div class="mute">${P.filter(p => p.supplier == s.name).length} products</div></div>${owner() ? `<button class="btn g sm" onclick="delSup('${s.id}')">Delete</button>` : ""}</div>`).join("") || '<p class="mute">No suppliers yet.</p>');
}
function addSup(e) { e.preventDefault(); const b = Object.fromEntries(new FormData(e.target)); act(() => api(base + "/suppliers", "POST", b)); }
function delSup(id) { if (confirm("Delete this supplier? Products keep the name.")) act(() => api(base + "/suppliers/" + id, "DELETE")); }

// ----- tags (owner) -----
function vTag() {
  return `<form class="card" onsubmit="addTag(event)"><b>Add a tag</b><p class="mute">Each tag becomes a section on your online store, like “Bestsellers” or “Snacks”. Products with no tag appear under “More items”. Staff can put products into tags, but only you can create them.</p>
  <div class="row" style="flex-wrap:nowrap"><input name="name" placeholder="e.g. Bestsellers" required maxlength="30" style="margin:0"><button class="btn">Add</button></div></form>` +
  (T.map((t, i) => `<div class="card row" style="justify-content:space-between"><div><b>${esc(t.name)}</b><div class="mute">${P.filter(p => (p.tags || []).includes(t.name)).length} products</div></div>
   <div class="row"><button class="btn g sm" ${i ? "" : "disabled"} onclick="moveTag('${t.id}','up')" aria-label="Move up">↑</button><button class="btn g sm" ${i < T.length - 1 ? "" : "disabled"} onclick="moveTag('${t.id}','down')" aria-label="Move down">↓</button><button class="btn g sm" onclick="delTag('${t.id}')">Delete</button></div></div>`).join("") || '<p class="mute">No tags yet.</p>');
}
function addTag(e) { e.preventDefault(); const n = e.target.elements.name.value; act(() => api(base + "/tags", "POST", { name: n })); }
const moveTag = (id, dir) => act(() => api(base + "/tags/" + id + "/move", "POST", { dir }));
function delTag(id) { if (confirm("Delete this tag? Products keep existing but lose the tag.")) act(() => api(base + "/tags/" + id, "DELETE")); }

// ----- staff (owner) -----
function vUsr() {
  return `<div class="card"><button class="btn" onclick="openStaff()">+ Add a staff member</button><p class="mute" style="margin:8px 0 0">Staff log in on the same page as you, using their username. Only you can set selling prices and make products live.</p></div>` +
  (U.map(u => `<div class="card"><div class="row" style="justify-content:space-between"><div><b>${esc(u.name)}</b> <span class="mute">@${esc(u.username)}</span></div><label class="sw" title="Allowed to log in"><input type="checkbox" ${u.active ? "checked" : ""} onchange="staffOn('${esc(u.username)}',this.checked)" aria-label="Can log in"><i></i></label></div>
   <div style="margin:6px 0">${Object.keys(PL).filter(k => u.perms[k]).map(k => `<span class="chip">${esc(PL[k])}${k == "orders" ? " (" + (u.perms.orderView || []).map(x => DL[x]).join(", ") + ")" : ""}</span>`).join("") || '<span class="mute">No permissions yet</span>'}</div>
   <div class="acts" style="margin:0"><button class="btn g sm" onclick="openStaff('${esc(u.username)}')">Permissions</button><button class="btn g sm" onclick="staffPw('${esc(u.username)}')">New password</button><button class="btn g sm" onclick="delStaff('${esc(u.username)}')">Delete</button></div></div>`).join("") || '<p class="mute">No staff yet.</p>');
}
function openStaff(un) {
  const u = U.find(x => x.username == un) || { perms: { add: true, stock: true, cost: true, tags: true, orders: false } };
  modal(`<form onsubmit="saveStaff(event,'${un || ""}')"><h2>${un ? "Permissions for " + esc(u.name) : "Add a staff member"}</h2>
  ${un ? "" : '<label>Name<input name="name" required></label><label>Username (they type this to log in)<input name="username" required pattern="[a-z0-9._-]{3,30}" autocapitalize="none"></label><label>Password (6+ characters)<input name="password" type="text" minlength="6" required></label>'}
  <label>What can they do?</label>${Object.keys(PL).map(k => `<label class="ck" style="margin:6px 0"><input type="checkbox" name="${k}" ${u.perms[k] ? "checked" : ""}> ${esc(PL[k])}</label>`).join("")}
  <label style="margin-top:8px">Which orders can they see? (only matters if “View and update orders” is ticked)</label>${Object.keys(DL).map(k => `<label class="ck" style="margin:4px 0"><input type="checkbox" name="ov_${k}" ${(u.perms.orderView || ["New", "Packed"]).includes(k) ? "checked" : ""}> ${DL[k]}</label>`).join("")}
  <p class="mute">Staff only get the delivery dropdown on orders. They never see prices, payments or invoices, and only you can cancel an order or change selling prices.</p>
  <div class="acts"><button type="button" class="btn g" onclick="closeM()">Cancel</button><button class="btn">Save</button></div></form>`);
}
function saveStaff(e, un) {
  e.preventDefault(); const f = e.target.elements, perms = Object.fromEntries(Object.keys(PL).map(k => [k, f[k].checked]));
  perms.orderView = Object.keys(DL).filter(k => e.target.querySelector(`[name="ov_${k}"]`).checked);
  act(async () => { if (un) await api(base + "/users/" + un, "PATCH", { perms }); else await api(base + "/users", "POST", { name: f.name.value, username: f.username.value.toLowerCase(), password: f.password.value, perms }); closeM(); });
}
const staffOn = (un, on) => act(() => api(base + "/users/" + un, "PATCH", { active: on }));
function staffPw(un) { const pw = prompt("New password for " + un + " (6+ characters)"); if (pw) act(() => api(base + "/users/" + un, "PATCH", { password: pw })); }
function delStaff(un) { if (confirm("Delete " + un + "? They will no longer be able to log in.")) act(() => api(base + "/users/" + un, "DELETE")); }

</script>
</body>
</html>
