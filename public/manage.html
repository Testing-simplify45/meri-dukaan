<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manage store</title>
<style>
:root{color-scheme:light dark;--bg:#f5f6fa;--card:#fff;--ink:#1b2133;--mute:#6b7488;--line:#e6e9f0;--ac:#6a3de8;--on:#fff;--soft:#f0ecff;--ok:#12805c;--okb:#e3f6ee;--wn:#9a6700;--wnb:#fff4d6;--er:#b3261e;--erb:#fde8e6;--in:#1a5fb4;--inb:#e5efff}
@media(prefers-color-scheme:dark){:root{--bg:#0e1220;--card:#171c2e;--ink:#eceffa;--mute:#98a2ba;--line:#2a3150;--ac:#a58bff;--on:#150b3a;--soft:#241c4a;--ok:#5fd6a6;--okb:#12362a;--wn:#f1c45b;--wnb:#3a2f10;--er:#ff9a92;--erb:#43191a;--in:#8fbaff;--inb:#16294a}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent}
#app{display:flex;min-height:100vh}
aside{width:210px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh}
.brand{font-weight:800;font-size:1.1rem;margin:0 8px 16px;overflow-wrap:anywhere}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--mute);font:inherit;font-weight:600;padding:9px 12px;border-radius:9px;cursor:pointer;margin-bottom:2px}
nav button.on{background:var(--soft);color:var(--ac)}
main{flex:1;min-width:0;max-width:760px;margin:0 auto;padding:16px 16px 40px}
.top{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{margin:0;font-size:1.35rem}h2{font-size:1rem;margin:0 0 10px}.mute{color:var(--mute);font-size:.85rem}.nm{font-size:1.1rem}
.av{width:42px;height:42px;border-radius:50%;background:var(--soft);color:var(--ac);display:grid;place-items:center;font-weight:800;font-size:1.1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;overflow-wrap:anywhere}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.bd{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.76rem;font-weight:600;white-space:nowrap}
.ok{background:var(--okb);color:var(--ok)}.wn{background:var(--wnb);color:var(--wn)}.er{background:var(--erb);color:var(--er)}.in{background:var(--inb);color:var(--in)}.nt{background:var(--bg);color:var(--mute)}
.hero{background:linear-gradient(135deg,#6a3de8,#9b2fe0);color:#fff;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 10px 24px rgba(106,61,232,.25)}
.hero .big{font-size:2.1rem;font-weight:800;margin:2px 0 12px;letter-spacing:-.5px}.hero small{display:block;opacity:.85}.hero b{font-size:1.25rem}
.hero .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hero .two div{background:rgba(255,255,255,.17);border-radius:14px;padding:10px 12px}
.gw{float:right;background:rgba(255,255,255,.2);border-radius:999px;padding:2px 10px;font-size:.8rem}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.qa button{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 4px;color:var(--ink);font:inherit;font-size:.78rem;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}.qa span{font-size:1.35rem;line-height:1}
.due{background:var(--wnb);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:6px}.due b{font-size:1.25rem}.due .grow{flex:1}
.sh{display:flex;justify-content:space-between;align-items:center;margin:20px 0 8px}.sh h2{margin:0;font-size:1.05rem}
.hs{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 4px}
.pc{flex:0 0 132px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;cursor:pointer;color:var(--ink);font:inherit}
.pc span{font-size:1.2rem}.pc b{display:block;font-size:1.6rem}.pc em{font-style:normal;color:var(--mute);font-size:.82rem}
.at{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 12px;margin-bottom:8px;cursor:pointer;width:100%;text-align:left;font:inherit;color:var(--ink)}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:1.15rem;flex:none}.at .grow{flex:1;min-width:0}.at b{display:block}
.oc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.bar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:var(--ac)}
.stk{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--bg);margin:8px 0}.stk i{display:block;height:100%}
.chip{display:inline-block;background:var(--bg);border-radius:999px;padding:3px 11px;font-size:.78rem;margin:0 6px 6px 0;color:var(--mute)}
.store{background:#0f1224;color:#fff;border-radius:22px;padding:16px;margin-bottom:14px}.store .st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.store .st div{background:rgba(255,255,255,.1);border-radius:14px;padding:12px 6px;text-align:center;font-size:.8rem}.store .st b{display:block;font-size:1.5rem}.store a{color:#cbb8ff;font-weight:600;text-decoration:none}
.two{display:grid;grid-template-columns:1fr;gap:0 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;color:var(--mute);font:inherit;font-weight:600;padding:7px 12px;cursor:pointer}.seg button.on{background:var(--soft);color:var(--ac)}
.btn{display:inline-block;text-decoration:none;font:inherit;font-weight:600;border:0;border-radius:12px;padding:10px 16px;background:var(--ac);color:var(--on);cursor:pointer;text-align:center}
.btn.g{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.sm{padding:7px 12px;font-size:.85rem}.btn.dk{background:#12122a;color:#fff}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%;margin:4px 0 10px}
select{width:auto;margin:0}label{display:block;font-size:.82rem;color:var(--mute)}.ck{display:flex;gap:8px;align-items:center;color:var(--ink)}.ck input{width:auto;margin:0}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);width:min(520px,94vw);padding:18px;max-height:92vh}dialog::backdrop{background:rgba(0,0,0,.5)}
.bn{display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);justify-content:space-around;align-items:flex-end;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.bn button{flex:1;background:none;border:0;color:var(--mute);font:inherit;font-size:.72rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;cursor:pointer}
.bn button span{font-size:1.25rem;line-height:1.2}.bn button.on{color:var(--ac)}
.bn .fab{flex:none;width:56px;height:56px;border-radius:50%;background:var(--ac);color:var(--on);font-size:2rem;margin:-24px 6px 0;box-shadow:0 6px 16px rgba(106,61,232,.45);justify-content:center;padding:0}
.login{max-width:380px;margin:60px auto}.err{color:var(--er);min-height:1.2em}
:focus-visible{outline:3px solid #f5b700;outline-offset:2px}
@media(min-width:801px){.two{grid-template-columns:1fr 1fr}}
@media(max-width:800px){
 #app{flex-direction:column}aside{display:none}.bn{display:flex}.dsk{display:none}
 main{padding:14px 16px calc(100px + env(safe-area-inset-bottom,0px))}
 input,select,textarea{font-size:16px}.btn{min-height:42px}.btn.sm{min-height:36px}.fg{grid-template-columns:1fr}
 dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:20px 20px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
}
.dot{position:absolute;top:2px;right:calc(50% - 24px);width:10px;height:10px;border-radius:50%;background:#e5271b;border:2px solid var(--card)}
.ic2{position:relative;display:inline-block}.ic2 .dot{top:-3px;right:-7px}
nav button{position:relative}nav button .dot{top:11px;right:12px}
.dot.big{top:12px;right:12px;width:11px;height:11px;border:0;box-shadow:0 0 0 3px rgba(229,39,27,.22)}
.sw{position:relative;display:inline-block;width:42px;height:24px;flex:none;margin:0}.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.15s}.sw i:before{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked+i{background:var(--ok)}.sw input:checked+i:before{left:21px}.sw input:disabled{cursor:not-allowed}.sw input:disabled+i{opacity:.45}
.th{width:56px;height:56px;border-radius:12px;object-fit:cover;background:var(--bg);flex:none;display:grid;place-items:center;font-size:1.5rem}
.ph2{position:relative;display:inline-block}.ph2 button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--er);color:#fff;cursor:pointer;line-height:1;padding:0;font-size:1rem}
.tg{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;margin:0 6px 6px 0;color:var(--ink);font-size:.88rem}.tg input{width:auto;margin:0}
input:disabled,select:disabled{opacity:.6}
</style>
</head>
<body>
<div id="login" class="card login"><h1>Manage your store</h1><label>Username<input id="user" autocomplete="username" autocapitalize="none"></label><label>Password or store key<input id="key" type="password" autocomplete="current-password"></label><button class="btn" onclick="login()">Open</button><p class="err" id="err"></p></div>
<div id="app" hidden>
  <aside><div class="brand" id="brand">Store</div><nav id="nav"></nav></aside>
  <main><div class="top"><div id="hd"></div><div class="row" id="top"></div></div><div id="view"></div></main>
</div>
<nav class="bn" id="bn"></nav>
<dialog id="dlg"></dialog>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const inr = n => "₹" + Math.round(n).toLocaleString("en-IN");
const sum = (a, f) => a.reduce((t, x) => t + f(x), 0);
const slug = new URLSearchParams(location.search).get("store");
const base = "/api/manage/" + slug;
const SK = "login:" + slug; // remembered on this device, one entry per store
const saved = (() => { try { return JSON.parse(localStorage.getItem(SK) || "{}"); } catch (e) { return {}; } })();
let SN = "Your store", key = saved.key || sessionStorage.getItem("k") || "", tok = saved.tok || "", ME = { role: "owner", perms: {} };
let P = [], O = [], S = [], T = [], U = [], tab = "dash", range = "30", flt = "all";
const owner = () => ME.role == "owner";
const can = p => owner() || !!(ME.perms && ME.perms[p]);
const PL = { add: "Add products and edit name, photos, supplier", stock: "Edit quantity and expiry", cost: "Edit purchase price", tags: "Assign tags to products", orders: "View and update orders" };

async function api(p, method, body) {
  const r = await fetch(p, { method: method || "GET", headers: { "x-key": key, "x-token": tok, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Something went wrong");
  return j;
}
async function load() { [P, S, T, O, U] = await Promise.all([api(base + "/products"), api(base + "/suppliers"), api(base + "/tags"), can("orders") ? api(base + "/orders") : [], owner() ? api(base + "/users") : []]); }
async function start() {
  ME = await api(base + "/me"); await load();
  try { localStorage.setItem(SK, JSON.stringify({ key, tok })); } catch (e) {}
  $("login").hidden = true; $("app").hidden = false; if (tab == "ord" && !can("orders")) tab = "dash"; draw();
  fetch("/api/store/" + slug).then(r => r.json()).then(d => { SN = d.name; document.title = d.name + " – manage"; draw(); }).catch(() => {});
}
async function login() {
  const user = $("user").value.trim().toLowerCase(), pw = $("key").value;
  try {
    if (user) {
      const r = await fetch(base + "/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ user, password: pw }) });
      const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || "Could not log in");
      tok = j.token; key = "";
    } else { if (pw) key = pw; tok = ""; }
    await start();
  } catch (e) {
    key = ""; tok = "";
    $("err").textContent = !user && /log in again/i.test(e.message) ? "That password or store key doesn’t match this store. Staff: please type your username too." : e.message;
  }
}
if (!slug) document.body.innerHTML = '<p style="padding:20px">Open this page from the list on your admin page.</p>';
else if (key || tok) start().catch(() => { try { localStorage.removeItem(SK); } catch (e) {} key = ""; tok = ""; $("err").textContent = "Please log in again."; });
const act = async f => { try { await f(); await load(); } catch (e) { alert(e.message); } draw(); };
const logout = () => { try { localStorage.removeItem(SK); } catch (e) {} sessionStorage.clear(); location.reload(); };
$("dlg").addEventListener("close", () => { if (!$("app").hidden && tab == "ord") draw(); }); // puts a dropdown back if a dialog was cancelled
const modal = html => { $("dlg").innerHTML = html; if (!$("dlg").open) $("dlg").showModal(); };

// new orders appear without reloading: check every 30 seconds
setInterval(async () => {
  if (document.hidden || $("app").hidden || !can("orders")) return;
  try {
    const n = await api(base + "/orders"), un = a => a.filter(o => o.seen === false).length, changed = n.length != O.length || un(n) != un(O);
    O = n; if (changed) $("dlg").open ? drawNav() : draw();
  } catch (e) {}
}, 30000);

// ----- money and status helpers -----
const DL = { New: "New", Packed: "To dispatch", "In transit": "In transit", Delivered: "Delivered", Cancelled: "Cancelled" };
const DB = { New: "wn", Packed: "wn", "In transit": "in", Delivered: "ok", Cancelled: "nt" };
const PB = { Paid: "ok", Partial: "wn", Pending: "nt", Overdue: "er", Cancelled: "nt" };
const age = o => (Date.now() - new Date(o.createdAt)) / 864e5;
const due = o => Math.max(0, o.total - (o.paid || 0));
const pst = o => o.status == "Cancelled" ? "Cancelled" : due(o) <= 0 ? "Paid" : o.paid > 0 ? "Partial" : age(o) > 7 ? "Overdue" : "Pending";
const inR = o => range == "1" ? new Date(o.createdAt).toDateString() == new Date().toDateString() : age(o) <= +range;
const inP = o => range == "1" ? new Date(o.createdAt).toDateString() == new Date(Date.now() - 864e5).toDateString() : (age(o) > +range && age(o) <= 2 * +range);
const dt = o => o.createdAt ? new Date(o.createdAt).toLocaleDateString("en-IN", { day: "numeric", month: "short" }) : "";
const wa = o => { let n = String(o.phone).replace(/\D/g, ""); if (n.length == 10) n = "91" + n; return "https://wa.me/" + n + "?text=" + encodeURIComponent(`Hi ${o.name}, a gentle reminder about order ${o.number}: ${inr(due(o))} is still due. Thank you!`); };
const unseen = () => can("orders") ? O.filter(o => o.seen === false).length : 0;

// ----- frame: sidebar, bottom bar, header -----
const go = t => { tab = t; draw(); scrollTo(0, 0); };
const showOrders = f => { flt = f; go("ord"); };
function drawNav() {
  const dot = unseen() ? '<i class="dot"></i>' : "";
  const items = [["dash", "Dashboard"], ["prod", "Products"]]; if (can("orders")) items.push(["ord", "Orders"]); items.push(["sup", "Suppliers"]); if (owner()) items.push(["tag", "Tags"], ["usr", "Staff"]);
  $("nav").innerHTML = items.map(([k, l]) => `<button class="${tab == k ? "on" : ""}" onclick="go('${k}')">${l}${k == "ord" ? dot : ""}</button>`).join("") + '<button onclick="logout()">Log out</button>';
  const tb = (k, ic, l, d) => `<button class="${tab == k ? "on" : ""}" onclick="go('${k}')"><span class="ic2">${ic}${d || ""}</span>${l}</button>`;
  $("bn").innerHTML = tb("dash", "🏠", "Home") + tb("prod", "📦", "Products") + (can("add") ? '<button class="fab" onclick="openProd()" aria-label="Add product">+</button>' : '<span style="width:56px"></span>') +
    (can("orders") ? tb("ord", "🧾", "Orders", dot) : tb("sup", "👥", "Suppliers")) + `<button class="${["sup", "tag", "usr"].includes(tab) && can("orders") ? "on" : ""}" onclick="openMore()"><span class="ic2">⋯</span>More</button>`;
}
function draw() {
  $("brand").textContent = SN; drawNav();
  const hr = new Date().getHours(), hi = hr < 12 ? "Good morning" : hr < 17 ? "Good afternoon" : "Good evening";
  const H = { prod: ["Products", "What you sell, what it costs and what is left."], ord: ["Orders", "Tap an order to mark it as seen."], sup: ["Suppliers", "The people you buy stock from."], tag: ["Tags", "Each tag becomes a section on your online store."], usr: ["Staff", "People who help you run the store."] }[tab];
  $("hd").innerHTML = tab == "dash" ? `<div class="row"><div class="av">${esc(SN.charAt(0).toUpperCase())}</div><div><div class="mute">${hi}${owner() ? "" : ", " + esc(ME.name)}</div><b class="nm">${esc(SN)}</b></div></div>` : `<h1>${H[0]}</h1><div class="mute">${H[1]}</div>`;
  $("top").innerHTML = tab == "dash" && owner() ? `<div class="seg">${[["1", "Today"], ["30", "30 days"], ["365", "Year"]].map(([v, l]) => `<button class="${range == v ? "on" : ""}" onclick="range='${v}';draw()">${l}</button>`).join("")}</div>` : tab == "prod" && can("add") ? '<button class="btn dsk" onclick="openProd()">+ Add product</button>' : "";
  $("view").innerHTML = { dash: vDash, prod: vProd, ord: vOrd, sup: vSup, tag: vTag, usr: vUsr }[tab]();
}
function openMore() {
  modal(`<h2>More</h2><div style="display:grid;gap:8px"><button class="btn g" onclick="$('dlg').close();go('sup')">👥 Suppliers</button>
  ${owner() ? `<button class="btn g" onclick="$('dlg').close();go('tag')">🏷️ Tags</button><button class="btn g" onclick="$('dlg').close();go('usr')">🔑 Staff</button>
  <a class="btn g" href="/s/${esc(slug)}" target="_blank">🛍️ Open my online store</a><button class="btn g" onclick="navigator.clipboard.writeText(location.origin+'/s/${esc(slug)}');this.textContent='Link copied'">🔗 Copy store link</button>` : ""}
  <button class="btn g" onclick="logout()">Log out</button><button class="btn" onclick="$('dlg').close()">Close</button></div>`);
}

// ----- home -----
function vDash() {
  const A = [];
  P.forEach(p => {
    if (p.qty != null) { if (p.qty <= 0) A.push(["er", "⚠️", p.name, "Out of stock · tap to restock", p.id]); else if (p.qty <= (p.lowAt ?? 5)) A.push(["wn", "📉", p.name, "Low stock · " + p.qty + " left", p.id]); }
    if (p.expiry && (p.qty == null || p.qty > 0)) {
      const d = Math.ceil((new Date(p.expiry) - Date.now()) / 864e5);
      if (d < 0) A.push(["er", "⏳", p.name, "Expired " + (-d) + " days ago", p.id]); else if (d <= 30) A.push(["wn", "⏳", p.name, "Expires in " + d + " days" + (p.qty != null ? " · " + p.qty + " units" : ""), p.id]);
    }
    if (owner() && !(p.price > 0)) A.push(["wn", "🏷️", p.name, "Needs a selling price before it can go live", p.id]);
  });
  A.sort((a, b) => (a[0] == "er" ? 0 : 1) - (b[0] == "er" ? 0 : 1));
  const cnt = s => O.filter(o => o.status == s).length;
  const att = `<div class="sh"><h2>Needs attention</h2>${A.length ? `<span class="bd er">${A.length}</span>` : ""}</div>` + (A.slice(0, 6).map(([c, i, n, t, id]) => `<button class="at" onclick="openProd('${id}')"><div class="ic ${c}">${i}</div><div class="grow"><b>${esc(n)}</b><span class="mute">${esc(t)}</span></div><span class="mute">›</span></button>`).join("") || '<div class="card mute">All good. Nothing needs attention.</div>');
  const pipe = `<div class="sh"><h2>Order pipeline</h2><span class="mute">Live</span></div><div class="hs">${[["🛒", "New orders", "New"], ["📦", "To dispatch", "Packed"], ["🚚", "In transit", "In transit"], ["✅", "Delivered", "Delivered"]].map(([i, l, st]) => `<button class="pc" onclick="showOrders('${st}')"><span>${i}</span><b>${cnt(st)}</b><em>${l}</em></button>`).join("")}</div>`;
  const recent = `<div class="sh"><h2>Recent orders</h2><a href="#" onclick="showOrders('all');return false" style="color:var(--ac);font-weight:600;text-decoration:none">View all</a></div>` +

}
function addSup(e) { e.preventDefault(); const b = Object.fromEntries(new FormData(e.target)); act(() => api(base + "/suppliers", "POST", b)); }
function delSup(id) { if (confirm("Delete this supplier? Products keep the name.")) act(() => api(base + "/suppliers/" + id, "DELETE")); }

// ----- tags (owner) -----
function vTag() {
  return `<form class="card" onsubmit="addTag(event)"><b>Add a tag</b><p class="mute">Each tag becomes a section on your online store, like “Bestsellers” or “Snacks”. Products with no tag appear under “More items”. Staff can put products into tags, but only you can create them.</p>
  <div class="row" style="flex-wrap:nowrap"><input name="name" placeholder="e.g. Bestsellers" required maxlength="30" style="margin:0"><button class="btn">Add</button></div></form>` +
  (T.map((t, i) => `<div class="card row" style="justify-content:space-between"><div><b>${esc(t.name)}</b><div class="mute">${P.filter(p => (p.tags || []).includes(t.name)).length} products</div></div>
   <div class="row"><button class="btn g sm" ${i ? "" : "disabled"} onclick="moveTag('${t.id}','up')" aria-label="Move up">↑</button><button class="btn g sm" ${i < T.length - 1 ? "" : "disabled"} onclick="moveTag('${t.id}','down')" aria-label="Move down">↓</button><button class="btn g sm" onclick="delTag('${t.id}')">Delete</button></div></div>`).join("") || '<p class="mute">No tags yet.</p>');
}
function addTag(e) { e.preventDefault(); const n = e.target.elements.name.value; act(() => api(base + "/tags", "POST", { name: n })); }
const moveTag = (id, dir) => act(() => api(base + "/tags/" + id + "/move", "POST", { dir }));
function delTag(id) { if (confirm("Delete this tag? Products keep existing but lose the tag.")) act(() => api(base + "/tags/" + id, "DELETE")); }

// ----- staff (owner) -----
function vUsr() {
  return `<div class="card"><button class="btn" onclick="openStaff()">+ Add a staff member</button><p class="mute" style="margin:8px 0 0">Staff log in on the same page as you, using their username. Only you can set selling prices and make products live.</p></div>` +
  (U.map(u => `<div class="card"><div class="row" style="justify-content:space-between"><div><b>${esc(u.name)}</b> <span class="mute">@${esc(u.username)}</span></div><label class="sw" title="Allowed to log in"><input type="checkbox" ${u.active ? "checked" : ""} onchange="staffOn('${esc(u.username)}',this.checked)" aria-label="Can log in"><i></i></label></div>
   <div style="margin:6px 0">${Object.keys(PL).filter(k => u.perms[k]).map(k => `<span class="chip">${esc(PL[k])}${k == "orders" ? " (" + (u.perms.orderView || []).map(x => DL[x]).join(", ") + ")" : ""}</span>`).join("") || '<span class="mute">No permissions yet</span>'}</div>
   <div class="acts" style="margin:0"><button class="btn g sm" onclick="openStaff('${esc(u.username)}')">Permissions</button><button class="btn g sm" onclick="staffPw('${esc(u.username)}')">New password</button><button class="btn g sm" onclick="delStaff('${esc(u.username)}')">Delete</button></div></div>`).join("") || '<p class="mute">No staff yet.</p>');
}
function openStaff(un) {
  const u = U.find(x => x.username == un) || { perms: { add: true, stock: true, cost: true, tags: true, orders: false } };
  modal(`<form onsubmit="saveStaff(event,'${un || ""}')"><h2>${un ? "Permissions for " + esc(u.name) : "Add a staff member"}</h2>
  ${un ? "" : '<label>Name<input name="name" required></label><label>Username (they type this to log in)<input name="username" required pattern="[a-z0-9._-]{3,30}" autocapitalize="none"></label><label>Password (6+ characters)<input name="password" type="text" minlength="6" required></label>'}
  <label>What can they do?</label>${Object.keys(PL).map(k => `<label class="ck" style="margin:6px 0"><input type="checkbox" name="${k}" ${u.perms[k] ? "checked" : ""}> ${esc(PL[k])}</label>`).join("")}
  <label style="margin-top:8px">Which orders can they see? (only matters if “View and update orders” is ticked)</label>${Object.keys(DL).map(k => `<label class="ck" style="margin:4px 0"><input type="checkbox" name="ov_${k}" ${(u.perms.orderView || ["New", "Packed"]).includes(k) ? "checked" : ""}> ${DL[k]}</label>`).join("")}
  <p class="mute">Staff only get the delivery dropdown on orders. They never see prices, payments or invoices, and only you can cancel an order or change selling prices.</p>
  <div class="acts"><button type="button" class="btn g" onclick="$('dlg').close()">Cancel</button><button class="btn">Save</button></div></form>`);
}
function saveStaff(e, un) {
  e.preventDefault(); const f = e.target.elements, perms = Object.fromEntries(Object.keys(PL).map(k => [k, f[k].checked]));
  perms.orderView = Object.keys(DL).filter(k => e.target.querySelector(`[name="ov_${k}"]`).checked);
  act(async () => { if (un) await api(base + "/users/" + un, "PATCH", { perms }); else await api(base + "/users", "POST", { name: f.name.value, username: f.username.value.toLowerCase(), password: f.password.value, perms }); $("dlg").close(); });
}
const staffOn = (un, on) => act(() => api(base + "/users/" + un, "PATCH", { active: on }));
function staffPw(un) { const pw = prompt("New password for " + un + " (6+ characters)"); if (pw) act(() => api(base + "/users/" + un, "PATCH", { password: pw })); }
function delStaff(un) { if (confirm("Delete " + un + "? They will no longer be able to log in.")) act(() => api(base + "/users/" + un, "DELETE")); }
</script>
</body>
</html>
