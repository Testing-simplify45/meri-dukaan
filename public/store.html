<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--pu:#4A1B7A;--pu2:#6B2FA8;--pl:#F1E8FA;--ye:#FFC72C;--yl:#FFF4CC;--bg:#FBF8FE;--ink:#2A1740;--mute:#6F6482;--line:#E6DCF2;--card:#fff;--ok:#1E8E4E;--err:#B3261E}
*{box-sizing:border-box;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 Nunito,system-ui,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button{font:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:10;background:var(--pu);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) 0 10px}
.top .wrap{display:flex;align-items:center;gap:8px}
.top h1{flex:1;margin:0;font-size:1.25rem;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{position:relative;width:42px;height:42px;border:0;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:1.15rem;display:grid;place-items:center}
.ib i{position:absolute;top:2px;right:2px;min-width:18px;height:18px;border-radius:9px;background:var(--ye);color:var(--pu);font:800 .7rem/18px Nunito;text-align:center;font-style:normal;padding:0 4px}
.bk{border:0;background:rgba(255,255,255,.14);color:#fff;width:42px;height:42px;border-radius:50%;font-size:1.3rem}
.ban{margin:14px 0;border-radius:24px;background:linear-gradient(135deg,var(--pu),var(--pu2));color:#fff;padding:22px 20px;position:relative;overflow:hidden}
.ban:after{content:"🍫";position:absolute;right:-6px;bottom:-14px;font-size:6.5rem;transform:rotate(-12deg);opacity:.95}
.ban small{color:var(--ye);font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.ban h2{margin:4px 0 12px;font-size:1.6rem;line-height:1.15;font-weight:900;max-width:70%}
.y{border:0;background:var(--ye);color:var(--pu);font-weight:900;border-radius:999px;padding:10px 20px}
.p{border:0;background:var(--pu);color:#fff;font-weight:800;border-radius:14px;padding:13px 18px}
.g{border:1.5px solid var(--line);background:#fff;color:var(--pu);font-weight:800;border-radius:14px;padding:11px 16px}
.p[disabled],.y[disabled]{opacity:.5}
.big{width:100%;font-size:1.05rem;padding:15px}
h3{font-size:1.15rem;font-weight:900;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
h3 a{font-size:.85rem;color:var(--pu2);font-weight:800;cursor:pointer}
.row{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px}
.row>.pc{flex:0 0 150px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer}
.pc .im{aspect-ratio:1;background:#fff;display:grid;place-items:center;font-size:2.6rem}
.pc img{width:100%;height:100%;object-fit:contain}
.pc .bd{padding:8px 10px 10px}.pc b{display:block;font-size:.92rem;line-height:1.2;min-height:2.2em;overflow:hidden}
.pr{font-weight:900;color:var(--pu)}.mrp{color:var(--mute);text-decoration:line-through;font-weight:600;font-size:.82rem;margin-left:4px}
.off{position:absolute;top:8px;left:8px;background:var(--ye);color:var(--pu);font-weight:900;font-size:.72rem;border-radius:8px;padding:2px 7px}
.so{position:absolute;inset:0;background:rgba(255,255,255,.65);display:grid;place-items:center;font-weight:900;color:var(--mute)}
.add{position:absolute;right:8px;bottom:8px;width:34px;height:34px;border-radius:50%;border:0;background:var(--pu);color:#fff;font-size:1.3rem;font-weight:800;line-height:1}
.hrt{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:1rem}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{border:0;border-radius:18px;padding:18px 14px;text-align:left;background:var(--pl);color:var(--pu);font-weight:900;font-size:1.02rem}
.cat:nth-child(4n+2),.cat:nth-child(4n+3){background:var(--yl)}.cat small{display:block;color:var(--mute);font-weight:700;margin-top:2px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:14px -16px;padding:0 16px}
.chips button{flex:none;border:1.5px solid var(--line);background:#fff;color:var(--pu);border-radius:999px;padding:7px 15px;font-weight:800}
.chips button.on{background:var(--pu);color:#fff;border-color:var(--pu)}
.rev{flex:0 0 240px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px}.st{color:#F5A400;letter-spacing:2px}
.tab{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab .wrap{display:flex}.tab button{position:relative;flex:1;border:0;background:none;padding:9px 0 8px;color:var(--mute);font-weight:800;font-size:.72rem}
.tab button span{display:block;font-size:1.35rem;line-height:1.1}.tab button.on{color:var(--pu)}
.tab i{position:absolute;top:3px;left:55%;min-width:18px;height:18px;border-radius:9px;background:var(--pu);color:#fff;font:800 .7rem/18px Nunito;font-style:normal;padding:0 4px}
.wa{position:fixed;right:14px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:19;width:54px;height:54px;border-radius:50%;background:#25D366;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.wa svg{width:30px;height:30px;fill:#fff}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;background:#fff;border-radius:20px;border:1px solid var(--line);margin-top:12px;scrollbar-width:none}
.gal>*{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:1;object-fit:contain;display:grid;place-items:center;font-size:5rem}
.dots{text-align:center;color:var(--mute);font-size:.8rem;margin-top:6px}
.opt{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0}.opt span{font-size:.8rem;color:var(--mute);font-weight:800;min-width:60px}
.opt button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:6px 13px;font-weight:800;color:var(--ink)}.opt button.on{border-color:var(--pu);background:var(--pu);color:#fff}.opt button.oos{text-decoration:line-through;opacity:.5}
.facts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.facts span{background:var(--pl);color:var(--pu);border-radius:10px;padding:4px 10px;font-weight:800;font-size:.85rem}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}.bar .wrap{display:flex;gap:10px;padding:0;align-items:center}
.qty{display:flex;align-items:center;background:var(--pl);border-radius:14px;flex:none}.qty button{border:0;background:none;width:42px;height:46px;font-size:1.3rem;color:var(--pu);font-weight:900}.qty b{min-width:22px;text-align:center}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.ln{display:flex;gap:10px;align-items:center;padding:8px 0}.ln img,.ln .th{width:54px;height:54px;border-radius:12px;object-fit:contain;background:#fff;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.ln .m{flex:1;min-width:0}.ln .m b{display:block;font-size:.95rem;line-height:1.2}
input,textarea,select{width:100%;font:inherit;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);margin:4px 0 10px}
input:focus,textarea:focus{outline:2px solid var(--pu2);border-color:var(--pu2)}
label{font-size:.82rem;font-weight:800;color:var(--mute)}
.err{color:var(--err);font-weight:700;min-height:1.2em;margin:0 0 8px}.note{background:var(--yl);border-radius:12px;padding:10px 12px;font-size:.88rem;font-weight:700;margin:10px 0}
.pay{display:flex;gap:10px}.pay button{flex:1;border:2px solid var(--line);background:#fff;border-radius:14px;padding:13px;font-weight:900;color:var(--ink)}.pay button.on{border-color:var(--pu);background:var(--pl);color:var(--pu)}
.menu button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:#fff;border-bottom:1px solid var(--line);padding:15px 4px;font-weight:800;color:var(--ink)}
.menu button b{margin-left:auto;color:var(--mute)}.menu em{font-style:normal;background:var(--pu);color:#fff;border-radius:9px;padding:0 7px;font-size:.75rem}
.tl{margin:6px 0 0}.tl div{position:relative;padding:0 0 18px 34px;color:var(--mute);font-weight:700}
.tl div:before{content:"";position:absolute;left:8px;top:20px;bottom:-2px;width:3px;background:var(--line)}.tl div:last-child:before{display:none}
.tl div:after{content:"";position:absolute;left:0;top:2px;width:19px;height:19px;border-radius:50%;background:#fff;border:3px solid var(--line)}
.tl .d{color:var(--ink)}.tl .d:before{background:var(--pu)}.tl .d:after{background:var(--pu);border-color:var(--pu)}
.tl .c:after{background:var(--ye);border-color:var(--pu)}.tl .c{color:var(--pu);font-weight:900}.tl small{display:block;font-weight:600;color:var(--mute)}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:900;background:var(--pl);color:var(--pu)}.tag.ok{background:#DDF3E5;color:var(--ok)}.tag.bad{background:#FBE0DD;color:var(--err)}
.empty{text-align:center;color:var(--mute);padding:50px 0;font-weight:700}
.toast{position:fixed;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom,0px));margin:0 auto;max-width:420px;background:var(--ink);color:#fff;padding:12px 14px;border-radius:14px;text-align:center;font-weight:700;z-index:99}
.otp{letter-spacing:10px;font-size:1.6rem;text-align:center;font-weight:900}
:focus-visible{outline:3px solid var(--ye);outline-offset:2px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const slug = location.pathname.split("/")[2];
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const LS = { get(k) { try { return localStorage.getItem(k + slug); } catch (e) { return null; } }, set(k, v) { try { v == null ? localStorage.removeItem(k + slug) : localStorage.setItem(k + slug, v); } catch (e) {} } };
let shop = { tags: [], products: [], reviews: [] }, loaded = false, failed = false;
let cart = {}; try { cart = JSON.parse(LS.get("cart") || "{}") || {}; } catch (e) { cart = {}; }
let token = LS.get("tok") || "", me = null, stack = [["home"]], view = ["home"], sel = {}, tag = "", q = "", pay = "Cash", gi = { name: "", phone: "", address: "", email: "", note: "" }, addrId = "", form = null, otp = { email: "", sent: false }, placed = null, msg = "", busy = false;

// ---- talking to the server ----
async function api(path, method, body, auth) {
  const r = await fetch("/api/store/" + slug + path, { method: method || "GET", headers: Object.assign({ "Content-Type": "application/json" }, token ? { "x-ctoken": token } : {}), body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && token) { token = ""; me = null; LS.set("tok", null); }
  if (!r.ok) throw new Error(j.error || "Something went wrong. Please try again.");
  return j;
}
async function loadShop() { try { shop = await api(""); document.title = shop.name; loaded = true; failed = false; } catch (e) { failed = true; } render(); }
async function loadMe() { if (!token) return; try { me = await api("/c/me"); } catch (e) { me = null; } render(); }
function toast(t) { let n = $("toast"); if (!n) { n = document.createElement("div"); n.id = "toast"; n.className = "toast"; n.setAttribute("role", "status"); document.body.appendChild(n); } n.textContent = t; n.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => n.style.display = "none", 3200); }

// ---- navigation ----
function go(...v) { stack.push(view); view = v; msg = ""; render(); scrollTo(0, 0); }
function back() { view = stack.pop() || ["home"]; msg = ""; render(); }
function root(v) { stack = []; view = [v]; msg = ""; render(); scrollTo(0, 0); }

// ---- products ----
const find = id => shop.products.find(p => p.id === id);
const left = p => p.qty === null ? 99 : p.qty;
const sibs = p => shop.products.filter(x => x.group === p.group);
const rep = p => find(p.group) || p;
const groups = list => { const used = {}, out = []; [...list].sort((a, b) => (a.group === a.id ? 0 : 1) - (b.group === b.id ? 0 : 1)).forEach(p => { if (used[p.group]) return; used[p.group] = 1; out.push(p); }); return out; };
const cartTotal = () => Object.entries(cart).reduce((t, [id, n]) => t + (find(id) ? find(id).price * n : 0), 0);
const cartCount = () => Object.entries(cart).reduce((t, [id, n]) => t + (find(id) ? n : 0), 0);
const saveCart = () => LS.set("cart", JSON.stringify(cart));
const KIND = { general: ["Colour", "Size"], food: ["Flavour", "Weight"] };
const label = p => { const o = [p.o1, p.o2].filter(Boolean); return o.length && !o.every(v => p.name.toLowerCase().includes(v.toLowerCase())) ? `${p.name} (${o.join(", ")})` : p.name; };
const pct = p => p.mrp > p.price ? Math.round(100 * (p.mrp - p.price) / p.mrp) : 0;
const priceHtml = p => `<span class="pr">₹${p.price}</span>${p.mrp ? `<span class="mrp">₹${p.mrp}</span>` : ""}`;
function chg(id, d) {
  const p = find(id); if (!p) return; const c = (cart[id] || 0) + d, mq = shop.maxQty || 20;
  if (d > 0 && c > left(p)) { toast("No more stock available."); return; }
  if (d > 0 && c > mq) { toast(`You can order up to ${mq} of one item at a time. For bigger orders, please contact the shop${shop.phone ? " on " + shop.phone : ""}.`); return; }
  c <= 0 ? delete cart[id] : cart[id] = c; saveCart(); render();
}
function wished(id) { return me && me.wishlist.includes(id); }
async function heart(e, id) {
  e.stopPropagation(); if (!token) { toast("Log in to save favourites."); go("login"); return; }
  const on = !wished(id); me.wishlist = on ? [...me.wishlist, id] : me.wishlist.filter(x => x !== id); render();
  try { await api("/c/wishlist", "PUT", { id, on }); } catch (er) { toast(er.message); loadMe(); }
}
function card(p) {
  const single = sibs(p).length < 2, so = left(p) <= 0;
  return `<div class="pc" onclick="go('product','${p.id}')"><div class="im">${p.photos[0] ? `<img src="${esc(p.photos[0])}" alt="${esc(p.name)}" loading="lazy">` : "🍫"}</div>${pct(p) ? `<span class="off">${pct(p)}% OFF</span>` : ""}
    <button class="hrt" aria-label="Save to wishlist" onclick="heart(event,'${p.id}')">${wished(p.id) ? "💜" : "🤍"}</button>
    <div class="bd"><b>${esc(p.name)}</b>${priceHtml(p)}</div>${so ? '<div class="so">Sold out</div>' : single ? `<button class="add" aria-label="Add ${esc(p.name)} to cart" onclick="event.stopPropagation();chg('${p.id}',1);toast('Added to cart')">+</button>` : ""}</div>`;
}
const rowOf = list => `<div class="row">${list.map(card).join("")}</div>`;

// ---- screens ----
const bell = () => `<button class="ib" aria-label="Notifications" onclick="${token ? "openNotifs()" : "go('login')"}">🔔${me && me.unread ? `<i>${me.unread}</i>` : ""}</button>`;
const topBar = (title, bk) => `<div class="top"><div class="wrap">${bk ? '<button class="bk" aria-label="Back" onclick="back()">‹</button>' : ""}<h1>${esc(title)}</h1>${bk ? "" : `<button class="ib" aria-label="Search" onclick="go('search')">🔍</button>${bell()}`}</div></div>`;

function home() {
  const ps = shop.products, newer = [...ps].sort((a, b) => b.at - a.at).slice(0, 8), best = [...ps].filter(p => p.sold > 0).sort((a, b) => b.sold - a.sold).slice(0, 8), offers = ps.filter(p => pct(p) > 0).sort((a, b) => pct(b) - pct(a)).slice(0, 8), feat = ps.filter(p => p.featured).slice(0, 8);
  const sec = (t, l, to) => l.length ? `<h3>${t}${to ? `<a onclick="${to}">See all</a>` : ""}</h3>${rowOf(groups(l))}` : "";
  return topBar(shop.name) + `<main class="wrap"><div class="ban"><small>Welcome</small><h2>Sweet picks from ${esc(shop.name)}</h2><button class="y" onclick="root('cats')">Shop now</button></div>
    ${sec("New arrivals", newer)}${sec("Bestsellers", best)}${sec("Offers & discounts", offers)}
    ${shop.tags.length ? `<h3>Shop by category</h3><div class="cats">${shop.tags.map(t => `<button class="cat" onclick="tag=this.dataset.t;root('cats')" data-t="${esc(t)}">${esc(t)}<small>${ps.filter(p => p.tags.includes(t)).length} items</small></button>`).join("")}</div>` : ""}
    ${sec("Featured", feat)}
    ${shop.reviews.length ? `<h3>Customer reviews${shop.rating ? `<span style="font-size:.9rem;color:var(--mute)"><span class="st">★</span> ${shop.rating.avg} (${shop.rating.n})</span>` : ""}</h3><div class="row">${shop.reviews.map(r => `<div class="rev"><div class="st">${"★".repeat(r.rating)}${"☆".repeat(5 - r.rating)}</div><p style="margin:6px 0">${esc(r.text) || "Loved it!"}</p><b>${esc(r.name)}</b></div>`).join("")}</div>` : ""}
    ${ps.length ? "" : '<p class="empty">No products yet. Please check back soon.</p>'}</main>`;
}
function cats() {
  const list = tag ? shop.products.filter(p => p.tags.includes(tag)) : shop.products;
  return topBar("Categories") + `<main class="wrap"><div class="chips"><button class="${tag ? "" : "on"}" onclick="tag='';render()">All</button>${shop.tags.map(t => `<button class="${tag === t ? "on" : ""}" data-t="${esc(t)}" onclick="tag=this.dataset.t;render()">${esc(t)}</button>`).join("")}</div>
    ${list.length ? `<div class="grid">${groups(list).map(card).join("")}</div>` : '<p class="empty">Nothing here yet.</p>'}</main>`;
}
function search() {
  const s = q.trim().toLowerCase(), hits = s ? shop.products.filter(p => [p.name, p.description, p.o1, p.o2, ...p.tags].join(" ").toLowerCase().includes(s)) : [];
  return `<div class="top"><div class="wrap"><button class="bk" aria-label="Back" onclick="back()">‹</button><input id="qi" value="${esc(q)}" placeholder="Search chocolates" aria-label="Search" style="margin:0" oninput="q=this.value;drawHits()" autofocus></div></div><main class="wrap"><div id="hits"></div></main>`;
}
function drawHits() {
  const s = q.trim().toLowerCase(), hits = s ? shop.products.filter(p => [p.name, p.description, p.o1, p.o2, ...p.tags].join(" ").toLowerCase().includes(s)) : [];
  $("hits").innerHTML = !s ? '<p class="empty">Type to search</p>' : hits.length ? `<p style="color:var(--mute);font-weight:700">${hits.length} result${hits.length > 1 ? "s" : ""}</p><div class="grid">${hits.map(card).join("")}</div>` : '<p class="empty">Nothing matches your search.</p>';
}
function product() {
  const p = find(view[1]); if (!p) return topBar("Not found", 1) + '<p class="empty">This product is no longer available.</p>';
  const S = sibs(p), L = KIND[S.some(x => x.kind == "food") ? "food" : "general"];
  const opts = S.length < 2 ? "" : [0, 1].map(i => { const f = i ? "o2" : "o1", o = i ? "o1" : "o2", vals = [...new Set(S.map(x => x[f]).filter(Boolean))]; return vals.length ? `<div class="opt"><span>${L[i]}</span>${vals.map(v => `<button class="${p[f] === v ? "on" : ""} ${S.filter(x => x[f] === v).every(x => left(x) <= 0) ? "oos" : ""}" data-v="${esc(v)}" onclick="pickOpt('${p.id}',${i},this.dataset.v)">${esc(v)}</button>`).join("")}</div>` : ""; }).join("");
  const stock = left(p) <= 0 ? '<span style="color:var(--err)">Out of stock</span>' : p.qty === null ? "In stock" : p.qty <= 5 ? `Only ${p.qty} left` : "In stock";
  const n = cart[p.id] || 0, so = left(p) <= 0;
  return topBar(shop.name, 1) + `<main class="wrap"><div class="gal" onscroll="const c=document.getElementById('dots');if(c)c.textContent=(Math.round(this.scrollLeft/this.clientWidth)+1)+' / ${p.photos.length}'">${p.photos.map(u => `<img src="${esc(u)}" alt="${esc(p.name)}">`).join("") || "<div>🍫</div>"}</div>${p.photos.length > 1 ? `<div class="dots" id="dots">1 / ${p.photos.length} · swipe for more photos</div>` : ""}
    <div style="display:flex;gap:10px;align-items:flex-start;margin-top:14px"><h2 style="flex:1;margin:0;font-size:1.5rem;font-weight:900;line-height:1.15">${esc(p.name)}</h2><button class="ib" style="background:var(--pl)" aria-label="Save to wishlist" onclick="heart(event,'${p.id}')">${wished(p.id) ? "💜" : "🤍"}</button></div>
    <div style="margin:8px 0;font-size:1.3rem">${priceHtml(p)} ${pct(p) ? `<span class="tag ok">${pct(p)}% OFF</span>` : ""}</div>
    <div class="facts"><span>${stock}</span>${p.o2 ? `<span>${esc(p.o2)}</span>` : ""}${p.tags.map(t => `<span>${esc(t)}</span>`).join("")}</div>${opts}

  app.innerHTML = (SCREENS[v] || home)() + (hideTab ? "" : `<nav class="tab"><div class="wrap">${TABS.map(([k, i, l]) => `<button class="${v === k || (k === "account" && ["profile", "addresses", "orders", "track", "wishlist", "notifs", "support", "login", "review"].includes(v)) ? "on" : ""}" onclick="root('${k}')"><span>${i}</span>${l}</button>`).join("").replace("Cart</button>", `Cart</button>`).replace(/(<span>🛒<\/span>)/, `$1${n ? `<i>${n}</i>` : ""}`)}</div></nav>`) + (shop.wa && !["product", "checkout"].includes(v) ? `<a class="wa" href="https://wa.me/${shop.wa}" target="_blank" rel="noopener" aria-label="Chat on WhatsApp">${WA}</a>` : "");
  if (v === "search") { drawHits(); const i = $("qi"); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
  else if (focus && $(focus) && $(focus).focus) { $(focus).focus(); try { $(focus).setSelectionRange(pos, pos); } catch (e) {} }
}
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.tagName === "INPUT") { if (view[0] === "login") otp.sent ? verifyOtp() : sendOtp(); } });
loadShop(); loadMe();
