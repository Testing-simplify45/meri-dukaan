}
function addrForm() {
  const f = form, inp = (k, l, ico, t) => `<div class="fld"><label for="a_${k}">${l}</label><div class="bx">${ic(ico)}<input id="a_${k}" value="${esc(f[k])}" ${t ? `type="${t}"` : ""} oninput="form.${k}=this.value"></div></div>`;
  return `<div class="hdr"><button class="back" aria-label="Back" onclick="form=null;msg='';render()">${ic("back")}</button><div class="t"><h1>${f.id ? "Edit address" : "New address"}</h1></div></div><div class="chips" style="margin:4px 0 0">${["Home", "Work", "Other"].map(t => `<button class="${f.tag === t ? "on" : ""}" onclick="form.tag='${t}';render()">${t}</button>`).join("")}</div>
    <div style="margin:0 20px">${inp("name", "Full name", "user")}${inp("phone", "Mobile number", "call", "tel")}${inp("line", "House no., street", "home")}${inp("area", "Area / landmark (optional)", "pin")}${inp("pin", "Pincode", "pin")}${inp("city", "City", "pin")}<label style="margin-top:14px;display:flex;gap:10px;align-items:center;font-weight:700"><input type="checkbox" style="width:20px;height:20px;accent-color:var(--pu)" ${f.def ? "checked" : ""} onchange="form.def=this.checked"> Make this my default address</label></div><p class="err" role="alert">${esc(msg)}</p>
    <div class="bar"><div><button class="pbtn" onclick="saveAddr()">Save address ${ic("check", 20, 2.4)}</button></div></div>`;
}
async function saveAddr() { try { const j = await api("/c/addresses", "POST", form); addrId = j.id; form = null; msg = ""; await loadMe(); toast("Address saved"); } catch (e) { msg = e.message; render(); } }
async function delAddr(id) { if (!confirm("Delete this address?")) return; try { await api("/c/addresses/" + id, "DELETE"); await loadMe(); } catch (e) { toast(e.message); } }

// ---- orders: Track and Reorder sit under every order ----
const STEPS = [["Order placed", "Your order was placed successfully"], ["Payment confirmed", "The shop has confirmed your order"], ["Preparing your chocolates", "We are packing your order"], ["Ready for dispatch", "Your order is packed and ready"], ["Out for delivery", "Your order is on its way"], ["Delivered", "Enjoy! Thank you for ordering"]];
const reached = o => ({ 2: 0, 3: 2, 4: 3, 5: 4, 7: 5 }[o.stage]);
const stPill = o => o.stage === 0 ? '<span class="pill bad">Cancelled</span>' : o.stage === 7 ? '<span class="pill ok">Delivered</span>' : `<span class="pill${o.stage === 2 ? " w" : ""}">${["Order placed", "", "Preparing", "Ready for dispatch", "Out for delivery"][reached(o)] || ""}</span>`;
function orders() {
  return gate(() => {
    const L = me.orders.filter(o => ofil == "All" || (ofil == "Ongoing" && o.stage > 0 && o.stage < 7) || (ofil == "Delivered" && o.stage == 7) || (ofil == "Cancelled" && o.stage == 0));
    return hdr("My orders") + `<div class="chips" style="margin-top:4px">${["All", "Ongoing", "Delivered", "Cancelled"].map(t => `<button class="${ofil == t ? "on" : ""}" onclick="ofil='${t}';render()">${t}</button>`).join("")}</div>`
      + L.map(o => `<div class="card" style="margin-top:12px;border-radius:22px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><div style="font-size:17px;font-weight:800">Order #${esc(o.number)}</div><div style="font-size:13px;color:var(--mute);font-weight:600">${fmtD(o.at)} · ${o.lines.reduce((t, l) => t + l.qty, 0)} items · ${esc(o.payMethod)}</div></div>${stPill(o)}</div>
        <div style="margin-top:12px;display:flex;align-items:center;gap:8px"><div style="display:flex;gap:8px;overflow:hidden;min-width:0;flex:1">${o.lines.slice(0, 4).map((l, i) => `<div class="th m${i % 2 ? " b" : ""}">${l.photo ? `<img src="${esc(l.photo)}" alt="${esc(l.name)}">` : ic("bar", 22)}</div>`).join("")}</div><span style="margin-left:auto;text-align:right;flex:none"><span style="display:block;font-size:12px;color:var(--mute);font-weight:700">Items total</span><span style="font-size:19px;font-weight:800">₹${o.total}</span></span></div>
        ${o.stage === 7 && !o.reviewed ? `<div style="margin-top:10px;font-size:14px;font-weight:700">Rate this order: ${[1, 2, 3, 4, 5].map(n => `<button aria-label="${n} stars" onclick="go('review','${esc(o.number)}',${n})" style="border:none;background:none;font-size:24px;color:#E0A800;padding:0 2px">★</button>`).join("")}</div>` : ""}
        <div style="margin-top:12px;display:flex;gap:10px"><button onclick="go('track','${esc(o.number)}')" style="flex:1;height:46px;border:none;border-radius:14px;background:var(--pu);color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px">${ic("truck", 18)} Track order</button><button onclick="reorder('${esc(o.number)}')" style="flex:1;height:46px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--pu);font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px">${ic("repeat", 18)} Reorder</button></div></div>`).join("") || '<p class="empty">No orders here yet.</p>';
  });
}
function reorder(num) {
  const o = me.orders.find(x => x.number === num); let n = 0, miss = 0;
  o.lines.forEach(l => { const p = find(l.id); if (p && left(p) > 0) { cart[l.id] = Math.min(Math.max(cart[l.id] || 0, l.qty), left(p), shop.maxQty || 20); n++; } else miss++; });
  saveCart(); toast(n ? (miss ? "Some items are no longer available." : "Items added to your cart") : "Sorry, these items are not available now."); if (n) go("cart");
}
function track() {
  return gate(() => {
    const o = me.orders.find(x => x.number === view[1]); if (!o) return hdr("Track order") + '<p class="empty">Order not found.</p>';
    const r = reached(o), when = [o.at, o.ts.seen, o.ts.seen, o.ts.Packed, o.ts["In transit"], o.ts.Delivered], names = STEPS.map(s => s.slice());
    if (o.payMethod !== "UPI") { names[1][0] = "Order confirmed"; names[1][1] = "Cash on delivery order confirmed"; } else names[1][1] = o.paid >= o.total ? "Your UPI payment is received" : "The shop has confirmed your order";
    const upi = o.upi ? `<div class="note" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span>Pay ₹${o.total - o.paid} by UPI</span><a class="ybtn" style="height:36px;padding:0 14px;text-decoration:none" href="upi://pay?pa=${encodeURIComponent(o.upi)}&pn=${encodeURIComponent(shop.name)}&am=${o.total - o.paid}&cu=INR&tn=${encodeURIComponent("Order " + o.number)}">Pay now</a></div>` : "";
    const head = o.stage === 0 ? ["Order cancelled", o.ts.Cancelled ? fmt(o.ts.Cancelled) : "", "x"] : o.stage === 7 ? ["Delivered", fmt(o.ts.Delivered), "check"] : [["Waiting for the shop", "", "Being prepared", "Ready for dispatch", "On its way to you"][r === 0 ? 0 : r - 1 > 3 ? 4 : r - 1] || "In progress", "We will email you at every step", "truck"];
    return hdr("Track order", { sub: `Order #${o.number} · ${fmtD(o.at)}` }) + `<div class="hcard" style="padding:16px;border-radius:22px"><div style="width:52px;height:52px;border-radius:16px;background:var(--ye);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none">${ic(head[2], 26)}</div><div><div style="font-size:13px;font-weight:700;color:var(--line)">Current status</div><div style="font-size:22px;font-weight:800;line-height:1.2">${esc(head[0])}</div>${head[1] ? `<div style="font-size:13px;font-weight:600;color:var(--line)">${esc(head[1])}</div>` : ""}</div></div>${upi}
      ${o.stage === 0 ? "" : `<div class="tl"><h3>Order status</h3>${names.map(([t, d], i) => { const done = i < r || (r === 5 && i === 5), cur = i === r && !done; return `<div class="stp ${done ? "d" : cur ? "cur" : ""}"><span class="c">${ic(done || cur ? "check" : "clock", 16, 2.6)}</span><div class="h"><b>${t}</b>${(done || cur) && when[i] ? `<small>${fmtT(when[i])}</small>` : ""}</div><p>${d}</p></div>`; }).join("")}</div>`}
      <div class="card"><div style="font-size:13px;color:var(--mute);font-weight:700">Delivering to</div><div style="font-weight:700;margin-top:2px">${esc(o.name)} · ${esc(o.phone)}</div><div style="color:var(--mute);font-size:14px;font-weight:500">${esc(o.address)}</div>${NOTE_TXT}</div>
      <div style="margin:12px 20px 0;display:flex;gap:10px"><button class="gbtn" onclick="go('support')">Need help?</button><button class="pbtn" onclick="reorder('${esc(o.number)}')">${ic("repeat", 18)} Reorder</button></div>`;
  });
}
function review() {
  return gate(() => hdr("Rate your order") + `<div class="card"><div class="st" style="font-size:2rem">${"★".repeat(view[2])}${"☆".repeat(5 - view[2])}</div><div class="fld"><label for="rt">Tell us what you liked (optional)</label><div class="bx"><textarea id="rt" maxlength="300"></textarea></div></div><p class="err" style="margin-left:0" role="alert">${esc(msg)}</p><button class="pbtn" style="width:100%" onclick="sendReview()">Submit review</button></div>`);
}
async function sendReview() { try { await api("/c/reviews", "POST", { number: view[1], rating: Number(view[2]), text: $("rt").value }); await Promise.all([loadMe(), loadShop()]); toast("Thank you for your review!"); back(); } catch (e) { msg = e.message; render(); } }

function wishlist() {
  return gate(() => { const l = me.wishlist.map(find).filter(Boolean); return hdr("Wishlist", { sub: `${l.length} saved` }) + (l.length ? `<div class="grid">${l.map(p => card(p, "", 1)).join("")}</div>` : '<p class="empty">Tap the heart on any item to save it here.</p>'); });
}
const NOTE = { placed: ["box", "Order placed"], confirmed: ["check", "Order confirmed"], packed: ["gift", "Ready for dispatch"], out: ["truck", "Out for delivery"], delivered: ["check", "Delivered"], cancelled: ["x", "Order cancelled"] };
async function openNotifs() { go("notifs"); if (me && me.unread) { me.unread = 0; try { await api("/c/read", "POST"); } catch (e) {} } }
function notifs() {
  return gate(() => hdr("Notifications") + me.notifs.map(n => `<button class="ad" style="align-items:center" onclick="go('track','${esc(n.number)}')"><span class="ib">${ic(NOTE[n.k][0])}</span><span style="flex:1"><b style="font-size:16px;font-weight:800">${NOTE[n.k][1]}</b><span style="display:block;color:var(--mute);font-size:13px;font-weight:600">Order #${esc(n.number)} · ${fmt(n.at)}</span></span>${ic("chev", 20)}</button>`).join("") || '<p class="empty">No notifications yet.</p>');
}
function support() {
  const wa = shop.wa ? `https://wa.me/${shop.wa}?text=${encodeURIComponent("Hi " + shop.name + ", I need help with my order.")}` : "";
  return hdr("Contact support") + `<div class="card"><p style="margin:0 0 14px;font-weight:600">Questions about an order or a product? We are happy to help.</p>${wa ? `<a class="pbtn" style="background:#25D366;width:100%" href="${esc(wa)}" target="_blank" rel="noopener">${ic("chat")} Chat on WhatsApp</a>` : ""}${shop.phone ? `<a class="gbtn" style="margin-top:10px;text-decoration:none" href="tel:${esc(shop.phone)}">${ic("call")} Call ${esc(shop.phone)}</a>` : ""}${!wa && !shop.phone ? "<p>The shop has not added contact details yet.</p>" : ""}</div>`;
}

// ---- drawing ----
const WA = '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3C9 3 3.4 8.6 3.4 15.5c0 2.4.7 4.7 1.9 6.600L3.200 29l7.200-1.900c1.800 1 3.800 1.500 5.600 1.500 7 0 12.600-5.600 12.600-12.500S23 3 16 3zm6.500 17.500c-.3.800-1.600 1.500-2.200 1.600-.6.100-1.300.1-2.100-.1-.5-.2-1.100-.4-1.900-.7-3.300-1.400-5.400-4.700-5.600-4.900-.2-.2-1.300-1.700-1.300-3.200s.8-2.300 1.100-2.600c.3-.3.600-.4.800-.4h.6c.2 0 .5-.1.700.5.300.600.900 2.100 1 2.300.1.200.1.400 0 .6-.1.200-.2.400-.4.600-.2.200-.4.500-.5.600-.2.200-.3.400-.1.700.2.300.8 1.300 1.700 2.100 1.200 1 2.100 1.400 2.400 1.500.3.200.5.100.7-.1.200-.2.800-.9 1-1.200.2-.3.400-.3.700-.2.300.1 1.700.8 2 1 .3.200.5.200.6.400.1.100.1.800-.2 1.600z"/></svg>';
const SCREENS = { home, cats, search, product, cart: cartView, checkout, placed: placedView, login, account, profile, addresses, orders, track, review, wishlist, notifs, support };
const TABS = [["home", "home", "Home"], ["cats", "grid", "Categories"], ["cart", "bag", "Cart"], ["account", "user", "Account"]];
const ACCT = ["account", "profile", "addresses", "orders", "track", "wishlist", "notifs", "support", "login", "review"];
const NOBAR = ["product", "checkout", "cart", "profile", "search", "login"];
function render() {
  const app = $("app"); if (!app) return;
  if (failed) { app.innerHTML = '<p class="empty">Store not found.</p>'; return; }
  if (!loaded) { app.innerHTML = '<p class="empty">Loading…</p>'; return; }
  const v = view[0], ae = document.activeElement, focus = ae && ae.id, pos = ae && ae.selectionStart, n = cartCount();
  const fixedBar = ["product", "checkout", "cart", "profile"].includes(v) || (v === "addresses" && form) || (v === "login" && !otp.sent && false);
  const tabs = ["product", "checkout", "search", "profile"].includes(v) || (v === "addresses" && form) || (v === "cart" && n && false);
  const hide = ["product", "checkout", "profile"].includes(v) || (v === "addresses" && form) || (v === "cart" && n > 0);
  app.className = hide ? "nb" : "";
  app.innerHTML = (SCREENS[v] || home)() + (hide ? "" : `<nav class="nav" aria-label="Main"><div>${TABS.map(([k, i, l]) => `<button class="${v === k || (k === "account" && ACCT.includes(v)) ? "on" : ""}" onclick="root('${k}')"><span>${ic(i, 22)}${k === "cart" && n ? `<i>${n}</i>` : ""}</span>${l}</button>`).join("")}</div></nav>`)
    + (shop.wa && !hide && !["login", "search", "placed"].includes(v) ? `<a class="wa" href="https://wa.me/${shop.wa}" target="_blank" rel="noopener" aria-label="Chat with the shop on WhatsApp">${WA}</a>` : "");
  if (v === "search") { drawHits(); const i = $("qi"); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
  else if (focus && $(focus) && $(focus).focus && !(v === "login" && otp.sent)) { $(focus).focus(); try { $(focus).setSelectionRange(pos, pos); } catch (e) {} }
  if (v === "login" && otp.sent) { const c = $("code"); if (c && !c.dataset.f) { c.dataset.f = 1; c.focus(); } tick(); }
}
loadShop(); loadMe();
</script>
