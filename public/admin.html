<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meri Dukaan admin</title>
<style>
:root{color-scheme:light dark;--bg:#f6f7f9;--card:#fff;--ink:#1d2433;--mute:#667085;--line:#e3e7ee;--accent:#6a3de8;--on:#fff;--err:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#10151f;--card:#182030;--ink:#eef1f6;--mute:#9aa6bb;--line:#2a3550;--accent:#a58bff;--on:#150b3a;--err:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;overflow-wrap:anywhere}
input{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);width:100%;margin:4px 0 8px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:9px 14px;background:var(--accent);color:var(--on);cursor:pointer}
.err{color:var(--err);min-height:1.2em}a{color:var(--accent)}code{background:var(--bg);padding:2px 6px;border-radius:6px}
:focus-visible{outline:3px solid #f5b700;outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Admin</h1>
  <div id="login" class="card"><label>Your password<input id="key" type="password" autocomplete="current-password"></label><button onclick="login()">Open</button><p class="err" id="err"></p></div>
  <div id="main" hidden></div>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const old = new URLSearchParams(location.search).get("store");
if (old) location.replace("/manage?store=" + encodeURIComponent(old)); // older manage links still work
let key = sessionStorage.getItem("k") || "";
async function api(p, method, body) {
  const r = await fetch(p, { method: method || "GET", headers: { "x-key": key, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Something went wrong");
  return j;
}
async function login() {
  key = $("key").value || key;
  try { await platform(); sessionStorage.setItem("k", key); $("login").hidden = true; $("main").hidden = false; }
  catch (e) { $("err").textContent = e.message; }
}
if (key && !old) login();
async function platform() {
  const list = await api("/api/admin/stores");
  $("title").textContent = "Your stores";
  $("main").innerHTML = `<div class="card"><b>Create a store</b>
    <input id="sn" placeholder="Store name, e.g. Asha Sarees"><input id="sl" placeholder="Link word, e.g. asha-sarees">
    <input id="se" type="email" placeholder="Store owner’s email (optional)"><button onclick="mk()">Create store</button><p class="err" id="e2"></p></div>` +
    list.map(s => `<div class="card"><b>${esc(s.name)}</b><br>Shop link: <a href="/s/${esc(s.slug)}" target="_blank">${location.origin}/s/${esc(s.slug)}</a>
      <br>Manage page: <a href="/manage?store=${esc(s.slug)}" target="_blank">${location.origin}/manage?store=${esc(s.slug)}</a>
      <br>Store key: <code>${esc(s.adminKey)}</code></div>`).join("");
}
async function mk() {
  try { await api("/api/admin/stores", "POST", { name: $("sn").value, slug: $("sl").value, ownerEmail: $("se").value }); platform(); }
  catch (e) { $("e2").textContent = e.message; }
}
</script>
</body>
</html>
